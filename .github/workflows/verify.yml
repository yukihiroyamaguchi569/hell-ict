name: 検証

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "!docs/materials/**"
      - "!docs/ui/mock/**"
      - "*.md"
  # mainへのpushでは走らせない。deploy.ymlのverifyジョブが同じ検証を行うため二重になる。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: pnpm verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      # E2Eの失敗は、wrangler dev 自身が落ちて以降が全部 ECONNREFUSED になる形で
      # 現れることがある（ProxyWorkerの「Network connection lost.」で自死する既知の
      # 不具合）。Playwrightの出力にはその理由が出ず、wranglerのデバッグログにしか
      # 残らないので、失敗時だけ中身を出す。
      - if: failure()
        run: for f in ~/.config/.wrangler/logs/*.log; do echo "===== $f"; cat "$f"; done

  verify-full:
    name: pnpm verify:full
    # 中核ロジックを大きく変更したPRは「監査レーン」ラベルを付けて実行する。
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, '監査レーン')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:full
