name: 本番デプロイ

# mainへマージしたら本番Worker（hell-ict）へ自動でデプロイする。
# paths-ignoreは付けない——配信するモックは docs/ui/mock/index.html にあり、
# docs配下だけの変更でもデプロイが要る（scripts/build-testplay.shが取り込む）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同時に複数のデプロイを走らせない。後から来たものを捨てると古い版が本番に残るので、
# キャンセルはせず順番に流す。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 検証を通ってからデプロイする。verify.ymlのverifyジョブと同じ手順。
  verify:
    name: pnpm verify
    # workflow_dispatchは選んだrefで走るため、refを絞らないと未マージのブランチを
    # 本番へ出せてしまう。手動実行はmainの出し直しに限る。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify

  deploy:
    name: wrangler deploy
    needs: verify
    # verifyと同じ理由でmainに限る（needsだけではjob側のifを継承しない）。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 配信するモックHTML・画像・ダッシュボードを apps/worker/public/ へ生成する。
      # wrangler.jsoncのassets.directoryがこのディレクトリを指している。
      - run: pnpm build:testplay
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          # packageManagerを明示するのは、actionのlockfile検出が
          # workingDirectory直下しか見ず（pnpm-lock.yamlはリポジトリ直下）、
          # 既定のnpmへ倒れてwranglerを別途インストールしてしまうため。
          # pnpmを指定すると`pnpm exec wrangler`で既存の版を見つけ、
          # apps/worker/package.jsonのdevDependencyがそのまま使われる
          # （wranglerVersionを指定しないことが「既存を使う」条件）。
          packageManager: pnpm
          command: deploy
      # デプロイ後、入口ガードが本番の設定で立ち上がっているかを確かめる。
      # eventNoがfalse（EVENT_NO未設定）や"invalid"（書き損じ）なら失敗させる。
      # teamMaxは数値のときだけ規則が効いている——"invalid"（TEAM_MAXの書き損じ）は
      # 全チームが404になるので、ここで捕まえる。
      # 反映に少し間があるので数回だけ待って再試行する。
      - name: /api/health を確認
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -fsS https://hell-ict.yukihiroyamaguchi.workers.dev/api/health) && \
              echo "$body" | jq -e '.status == "ok" and .guards.eventNo == true and (.guards.teamMax | type) == "number"' >/dev/null && \
              echo "health ok: $body" && exit 0
            echo "health not ready (attempt $i): ${body:-<no response>}"
            sleep 5
          done
          echo "::error::/api/health が status=ok / guards.eventNo=true / guards.teamMax=数値 になりません（EVENT_NO・TEAM_MAXの設定を確認する）"
          exit 1
      # 効果音はR2バケット（hell-ict-sounds）から配る。mp3はリポジトリに無いので
      # デプロイでは運ばれず、投入し忘れると本番だけ無音になる（進行は止まらないので
      # 当日まで気づけない）。代表として1点が200で返ることを確かめる。
      # 投入は `bash scripts/upload-sounds.sh`（docs/development-harness.md）。
      - name: /sounds/decision1.mp3 を確認
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://hell-ict.yukihiroyamaguchi.workers.dev/sounds/decision1.mp3)
            if [ "$code" = "200" ]; then
              echo "sounds ok: $code"
              exit 0
            fi
            echo "sounds not ready (attempt $i): $code"
            sleep 5
          done
          echo "::error::/sounds/decision1.mp3 が200になりません（R2バケット hell-ict-sounds への投入を確認する: bash scripts/upload-sounds.sh）"
          exit 1
