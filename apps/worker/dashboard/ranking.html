<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>結果発表 | 地獄のICT</title>
    <!--
      デブリーフィングで会場前面へ映す番付（着順・監査賞）と、次のICTへの申し送り。
      scripts/build-testplay.sh が /ranking.html として配る。申し送りは /ranking.html#handover。
      集計は本番Workerの GET /api/gm/debrief/results・/handover（apps/worker/src/debrief.ts）が行い、
      この画面は開いたときに1回だけ取る（自動更新しない。出し直しは再読み込み）。
      APIはGMのリセットと同じADMIN_TOKENで守られている。トークンは進捗ボードの #gm と同じ
      localStorageのキーに置くので、同じブラウザで保存済みなら入力は要らない。
      見た目は手元の予備（scripts/ranking-board/）に揃える。
      チーム名と一言は参加者の入力なので、必ず textContent で差し込む。
    -->
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121924;
        --panel-edge: #1e2a3a;
        --ink: #e8eef6;
        --ink-dim: #8ea0b8;
        --gold: #f5b942;
        --accent: #4cc2ff;
        --alert: #ff6b5e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        font-size: clamp(16px, 1.4vw, 26px);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2em 1em 3em;
      }
      /* 申し送りは1画面（1600×900想定）に収めるため、本文の高さをビューポートに固定する。 */
      body.handover {
        height: 100vh;
        padding: 1.2em 1.2em 1em;
      }
      [hidden] {
        display: none !important;
      }
      h1 {
        margin: 0 0 0.2em;
        font-size: 2.6em;
        letter-spacing: 0.1em;
        color: var(--gold);
      }
      body.handover h1 {
        margin: 0 0 0.6em;
        font-size: 2.2em;
      }
      .sub {
        margin: 0 0 1.6em;
        color: var(--ink-dim);
      }
      .gmbar {
        display: flex;
        gap: 0.5em;
        align-items: center;
        margin: 0 0 1.2em;
        font-size: 0.8em;
      }
      .gmbar input,
      .gmbar button {
        font: inherit;
        padding: 0.3em 0.6em;
        border-radius: 0.3em;
        border: 1px solid var(--panel-edge);
        background: var(--panel);
        color: var(--ink);
      }
      .gmbar button {
        cursor: pointer;
      }
      #ranking {
        width: min(100%, 40em);
        display: grid;
        gap: 1.6em;
      }
      section {
        background: var(--panel);
        border: 2px solid var(--panel-edge);
        border-radius: 0.6em;
        padding: 1em 1.4em;
      }
      h2 {
        margin: 0 0 0.6em;
        font-size: 1.2em;
        color: var(--accent);
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: grid;
        grid-template-columns: 3em 1fr auto;
        align-items: center;
        gap: 0.6em;
        padding: 0.5em 0;
        border-bottom: 1px solid var(--panel-edge);
      }
      li:last-child {
        border-bottom: none;
      }
      .rank {
        text-align: center;
        color: var(--ink-dim);
      }
      /* 上位3チームは文字だけ大きくし、列幅（em）の基準になる li の文字サイズは揃えたままにする。 */
      li.top .name,
      li.top .meta {
        font-size: 1.25em;
      }
      li.top .rank {
        font-size: 1.6em;
      }
      .name {
        font-weight: bold;
        overflow-wrap: anywhere;
      }
      .meta {
        color: var(--ink-dim);
        font-variant-numeric: tabular-nums;
      }
      .empty {
        color: var(--ink-dim);
        margin: 0.4em 0;
      }
      .audit .name {
        font-size: 1.5em;
        color: var(--gold);
      }
      #handovers {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
        grid-auto-rows: minmax(0, 1fr);
        gap: 1em;
      }
      .card {
        min-height: 0;
        background: var(--panel);
        border: 2px solid var(--panel-edge);
        border-radius: 0.6em;
        padding: 0.8em 1.1em;
        display: flex;
        flex-direction: column;
        gap: 0.4em;
      }
      .card .name {
        margin: 0;
        font-size: 1.3em;
        color: var(--accent);
      }
      /* 長文は折り返し、それでも溢れるカードだけ fitText が文字を小さくする。 */
      .text {
        flex: 1;
        min-height: 0;
        margin: 0;
        overflow: hidden;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .text.none {
        color: var(--ink-dim);
      }
      #handovers .empty {
        grid-column: 1 / -1;
        align-self: center;
        text-align: center;
        font-size: 1.6em;
        margin: 0;
      }
      footer {
        margin-top: 1.6em;
        color: var(--ink-dim);
        font-size: 0.75em;
      }
      body.handover footer {
        margin-top: 0.8em;
      }
      footer a {
        color: var(--ink-dim);
      }
      .error {
        color: var(--alert);
      }
    </style>
  </head>
  <body>
    <h1 id="title">結果発表</h1>
    <p class="sub" id="sub">聖クロノス総合病院 感染制御チーム 対策本部</p>

    <div class="gmbar" id="gmbar" hidden>
      <label for="gm-token">GMトークン</label>
      <input id="gm-token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN" />
      <button type="button" id="gm-save">保存</button>
      <span id="gm-status"></span>
    </div>

    <main id="ranking">
      <section>
        <h2>🏆 着順（Stage 6 クリア）</h2>
        <div id="goals"><p class="empty">読み込み中…</p></div>
      </section>
      <section class="audit">
        <h2>🔍 監査賞（罠を踏まずに Stage 3 を最速で通過）</h2>
        <div id="audit"><p class="empty">読み込み中…</p></div>
      </section>
    </main>
    <main id="handovers" hidden><p class="empty">読み込み中…</p></main>

    <footer>
      <span id="status"></span> ・ 開いた時点の集計（出し直しは再読み込み） ・
      <a id="switch" href="#handover">申し送りへ</a>
    </footer>

    <script>
      (() => {
        "use strict";
        const FETCH_TIMEOUT_MS = 15000;
        const MEDALS = ["🥇", "🥈", "🥉"];
        // 進捗ボード（dashboard.html #gm）と同じキー。同じブラウザで保存済みなら入力は要らない。
        const TOKEN_KEY = "hellIctAdminToken";
        const HANDOVER_HASH = "#handover";
        // 一言の文字サイズ（em）。溢れるカードだけ MIN_EM まで段階的に小さくする。
        const MAX_EM = 1.6;
        const MIN_EM = 0.8;
        const STEP_EM = 0.1;

        const gmbar = document.getElementById("gmbar");
        const gmToken = document.getElementById("gm-token");
        const gmSave = document.getElementById("gm-save");
        const gmStatus = document.getElementById("gm-status");

        /**
         * トークン（ADMIN_TOKEN）はこのブラウザの localStorage にだけ置く。プライベート
         * ウィンドウやストレージ禁止の設定では例外が飛ぶので、読み書きとも握りつぶして
         * 「入力はできるが覚えない」状態へ倒す（進捗ボードと同じ）。
         */
        const readToken = () => {
          try {
            return localStorage.getItem(TOKEN_KEY) || "";
          } catch {
            return "";
          }
        };
        const persistToken = (value) => {
          try {
            localStorage.setItem(TOKEN_KEY, value);
            return true;
          } catch {
            return false;
          }
        };
        let adminToken = readToken();

        const displayName = (name) => (name === "" ? "（チーム名なし）" : name);

        // 集計SQLの時刻は "YYYY-MM-DD HH:MM:SS.SSS"（UTC）。日本時間の時刻だけを出す。
        const toJstTime = (utc) => {
          const date = new Date(`${utc.replace(" ", "T")}Z`);
          if (Number.isNaN(date.getTime())) return utc;
          return date.toLocaleTimeString("ja-JP", { timeZone: "Asia/Tokyo", hour12: false });
        };

        const el = (tag, className, text) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        };

        const renderGoals = (goals) => {
          const list = document.getElementById("goals");
          if (goals.length === 0) {
            list.replaceChildren(el("p", "empty", "まだゴールしたチームはありません"));
            return;
          }
          const ol = el("ol");
          ol.append(
            ...goals.map((goal, i) => {
              const item = el("li", i < 3 ? "top" : "");
              item.append(
                el("span", "rank", MEDALS[i] ?? `${String(i + 1)}位`),
                el("span", "name", displayName(goal.teamName)),
                el("span", "meta", `${toJstTime(goal.goalAtUtc)} ゴール`),
              );
              return item;
            }),
          );
          list.replaceChildren(ol);
        };

        // audit は受賞チームだけ（同着なら複数）。0行なら「該当なし」（罠は確実に発動するので0行になりやすい）。
        const renderAudit = (audit) => {
          const box = document.getElementById("audit");
          const [best] = audit;
          if (best === undefined) {
            box.replaceChildren(
              el("p", "empty", "該当なし — 罠を踏まずに抜けたチームは、今回はいませんでした"),
            );
            return;
          }
          box.replaceChildren(
            ...audit.map((winner) => el("p", "name", displayName(winner.teamName))),
            el(
              "p",
              "meta",
              `Stage 3 を ${String(best.s3Min)} 分で通過${audit.length > 1 ? "（同着）" : ""}`,
            ),
          );
        };

        const fitText = (node) => {
          let em = MAX_EM;
          node.style.fontSize = `${String(em)}em`;
          while (node.scrollHeight > node.clientHeight && em > MIN_EM) {
            em = Math.max(MIN_EM, em - STEP_EM);
            node.style.fontSize = `${String(em)}em`;
          }
        };
        const fitAll = () => {
          document.querySelectorAll("#handovers .text").forEach(fitText);
        };

        // text が空の行は、PIIゲートで本文ごと保存されなかった一言。
        const card = (handover) => {
          const node = el("article", "card");
          node.append(
            el("h2", "name", displayName(handover.teamName)),
            handover.text === ""
              ? el("p", "text none", "（記録なし）")
              : el("p", "text", handover.text),
          );
          return node;
        };

        const renderHandovers = (handovers) => {
          const box = document.getElementById("handovers");
          if (handovers.length === 0) {
            box.replaceChildren(el("p", "empty", "まだ申し送りはありません"));
            return;
          }
          // 2段に並べる列数（2〜4列）。4チームまでは2×2、6チームで3×2、8チームで4×2。
          const cols = Math.min(4, Math.max(2, Math.ceil(handovers.length / 2)));
          box.style.setProperty("--cols", String(cols));
          box.replaceChildren(...handovers.map(card));
          fitAll();
        };

        const isObject = (value) => typeof value === "object" && value !== null;
        const isResults = (data) =>
          isObject(data) &&
          Array.isArray(data.goals) &&
          data.goals.every(
            (goal) =>
              isObject(goal) &&
              typeof goal.teamName === "string" &&
              typeof goal.goalAtUtc === "string",
          ) &&
          Array.isArray(data.audit) &&
          data.audit.every(
            (winner) =>
              isObject(winner) &&
              typeof winner.teamName === "string" &&
              typeof winner.s3Min === "number",
          );
        const isHandovers = (data) =>
          isObject(data) &&
          Array.isArray(data.handovers) &&
          data.handovers.every(
            (item) =>
              isObject(item) && typeof item.teamName === "string" && typeof item.text === "string",
          );

        const setStatus = (text, isError) => {
          const status = document.getElementById("status");
          status.textContent = text;
          status.className = isError ? "error" : "";
        };

        /** 404はGM系の「トークンが違う（または未設定）」。トークン欄を出して入れ直してもらう。 */
        class TokenRejected extends Error {}

        /**
         * APIを1回叩く。ネットワークエラー（try/catch）とHTTPエラー（!ok）の両方を
         * 失敗として扱い、AbortControllerでタイムアウトも切る。
         */
        const fetchJson = async (path, isValid) => {
          const controller = new AbortController();
          const timer = setTimeout(() => {
            controller.abort();
          }, FETCH_TIMEOUT_MS);
          try {
            const response = await fetch(path, {
              signal: controller.signal,
              cache: "no-store",
              headers: { Authorization: "Bearer " + adminToken },
            });
            if (response.status === 404) throw new TokenRejected("トークンを確認してください");
            const data = await response.json().catch(() => null);
            if (!response.ok) {
              const message =
                isObject(data) && typeof data.message === "string" ? data.message : "";
              throw new Error(message || `HTTP ${String(response.status)}`);
            }
            if (!isValid(data)) throw new Error("結果の形が想定と違う");
            return data;
          } finally {
            clearTimeout(timer);
          }
        };

        const showGmbar = (text) => {
          gmbar.hidden = false;
          gmToken.value = adminToken;
          gmStatus.textContent = text;
        };

        /** 番付と申し送りを1回ずつ取る。開いたとき（とトークンを保存したとき）だけ呼ぶ。 */
        const loadOnce = async () => {
          if (adminToken === "") {
            showGmbar("GMトークンを入れて保存してください");
            setStatus("未取得", true);
            return;
          }
          setStatus("集計中…", false);
          try {
            const [results, handover] = await Promise.all([
              fetchJson("/api/gm/debrief/results", isResults),
              fetchJson("/api/gm/debrief/handover", isHandovers),
            ]);
            gmbar.hidden = true;
            renderGoals(results.goals);
            renderAudit(results.audit);
            renderHandovers(handover.handovers);
            setStatus(
              `開催回 ${results.eventNo} ・ ${new Date(results.fetchedAt).toLocaleTimeString("ja-JP")} 集計`,
              false,
            );
          } catch (error) {
            if (error instanceof TokenRejected) showGmbar(error.message);
            setStatus(
              `取得に失敗しました（${error instanceof Error && error.name !== "AbortError" ? error.message : "時間切れ"}）`,
              true,
            );
          }
        };

        /** #handover で申し送り、それ以外で番付。切り替えは表示だけで、集計は取り直さない。 */
        const applyView = () => {
          const handover = location.hash === HANDOVER_HASH;
          document.body.classList.toggle("handover", handover);
          document.getElementById("ranking").hidden = handover;
          document.getElementById("handovers").hidden = !handover;
          document.getElementById("sub").hidden = handover;
          document.getElementById("title").textContent = handover
            ? "次のICTへの申し送り"
            : "結果発表";
          const link = document.getElementById("switch");
          link.textContent = handover ? "番付へ" : "申し送りへ";
          link.href = handover ? "#" : HANDOVER_HASH;
          if (handover) fitAll();
        };

        gmSave.addEventListener("click", () => {
          adminToken = gmToken.value.trim();
          gmStatus.textContent = persistToken(adminToken)
            ? "保存しました"
            : "このブラウザには保存できません（このタブを閉じるまで有効）";
          void loadOnce();
        });
        window.addEventListener("hashchange", applyView);
        window.addEventListener("resize", fitAll);

        applyView();
        void loadOnce();
      })();
    </script>
  </body>
</html>
