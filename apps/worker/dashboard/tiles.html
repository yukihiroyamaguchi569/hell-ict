<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>対策本部 進捗タイル | 地獄のICT</title>
    <!--
      会場前面ディスプレイ用の進捗タイル。単一ファイル・依存ゼロ・外部CDNなし。
      進捗ボード（dashboard.html）は1チーム1行で、30チームを超えると1画面に入らない。
      この画面は各チームをタイルで並べ、現在地をタイルの背景色で示す（40チームまで1画面）。
      scripts/build-testplay.sh が public/tiles.html としてコピーし、
      GET /api/progress/summary を10秒間隔でポーリングして描画する（取り方は進捗ボードと同じ）。
      チーム名は参加者の入力なので、必ず textContent で差し込む。
    -->
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121924;
        --panel-edge: #1e2a3a;
        --ink: #e8eef6;
        --ink-dim: #8ea0b8;
        --accent: #4cc2ff;
        --alert: #ff6b5e;
        /* 現在地の色。先へ進むほど暖かく明るい。Final はゴールとして金色で光らせる。 */
        --pos-0: #263142;
        --pos-1: #1c4a7a;
        --pos-2: #17707f;
        --pos-3: #1f7a4d;
        --pos-4: #6f7a12;
        --pos-5: #a8650f;
        --pos-6: #c23b22;
        --pos-7: #f5c542;
        --goal-ink: #1a1200;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Hiragino Kaku Gothic ProN",
          "Yu Gothic",
          "Meiryo",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: clamp(13px, 1vw, 19px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        gap: 1em;
        padding: 0.45em 1.2em;
        border-bottom: 2px solid var(--panel-edge);
        background: linear-gradient(180deg, #101722, #0b0f14);
      }
      h1 {
        margin: 0;
        font-size: 1.3em;
        letter-spacing: 0.06em;
      }
      h1 .sign {
        font-size: 0.7em;
        font-weight: 400;
        letter-spacing: 0.14em;
        color: var(--ink-dim);
        margin-right: 0.8em;
      }
      h1 .em {
        color: var(--accent);
      }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.9em;
        font-variant-numeric: tabular-nums;
      }
      .clock {
        font-size: 1.3em;
        letter-spacing: 0.04em;
      }
      .link {
        display: none;
        align-items: center;
        gap: 0.4em;
        padding: 0.2em 0.8em;
        border-radius: 999px;
        background: rgba(255, 107, 94, 0.15);
        border: 1px solid var(--alert);
        color: var(--alert);
        font-weight: 700;
      }
      .link.down {
        display: flex;
      }
      .link::before {
        content: "";
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        background: var(--alert);
        animation: blink 1.1s steps(2, start) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.15;
        }
      }

      main {
        flex: 1;
        min-height: 0;
        padding: 0.8em 1.2em;
        overflow: hidden;
      }
      /* 列数・タイルの高さ・文字の大きさは script の layoutTiles が決めて変数で渡す。 */
      /* .tiles と .empty の display は [hidden] の display:none より強いので、明示的に消す。 */
      .tiles[hidden],
      .empty[hidden] {
        display: none;
      }
      .tiles {
        height: 100%;
        display: grid;
        grid-template-columns: repeat(var(--cols, 6), minmax(0, 1fr));
        grid-auto-rows: var(--tile-h, 8em);
        gap: var(--gap, 10px);
        align-content: start;
      }
      .empty {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-dim);
        font-size: 1.5em;
      }
      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        padding: 0.2em 0.4em;
        border-radius: 10px;
        border: 3px solid transparent;
        color: #fff;
        font-size: var(--tile-font, 24px);
        font-weight: 700;
        line-height: 1.2;
        text-align: center;
        overflow: hidden;
      }
      .tile .name {
        /* 長い名前は2行まで折り返し、それでも余れば末尾を切る（タイルからはみ出さない）。 */
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        overflow: hidden;
        overflow-wrap: anywhere;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
      }
      .p0 {
        background: var(--pos-0);
        color: var(--ink-dim);
      }
      .p1 {
        background: var(--pos-1);
      }
      .p2 {
        background: var(--pos-2);
      }
      .p3 {
        background: var(--pos-3);
      }
      .p4 {
        background: var(--pos-4);
      }
      .p5 {
        background: var(--pos-5);
      }
      .p6 {
        background: var(--pos-6);
      }
      .p7 {
        background: var(--pos-7);
        color: var(--goal-ink);
        border-color: #fff3c4;
        box-shadow: 0 0 18px rgba(245, 197, 66, 0.55);
      }
      .p7 .name {
        text-shadow: none;
      }
      /* 5分以上更新のないチーム。枠を点線にするだけの控えめな印。 */
      .tile.stale {
        border: 3px dashed rgba(232, 238, 246, 0.75);
      }

      footer {
        border-top: 2px solid var(--panel-edge);
        background: #0d131b;
        padding: 0.4em 1.2em;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: nowrap;
        gap: 0.4em;
        font-size: 0.95em;
        font-weight: 700;
        white-space: nowrap;
      }
      .legend-arrow {
        color: var(--ink-dim);
      }
      .legend-note {
        margin-left: 1.2em;
        color: var(--ink-dim);
        font-weight: 400;
      }
      .legend-note .swatch {
        display: inline-block;
        width: 1.4em;
        height: 0.9em;
        margin-right: 0.3em;
        vertical-align: -0.1em;
        border: 2px dashed rgba(232, 238, 246, 0.75);
        border-radius: 3px;
      }
      .chip {
        padding: 0.15em 0.7em;
        border-radius: 6px;
        border: 2px solid transparent;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><span class="sign">聖クロノス総合病院</span>感染制御<span class="em">対策本部</span></h1>
      <div class="status">
        <div class="link" id="link">接続断</div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <main>
      <div class="tiles" id="tiles"></div>
      <p class="empty" id="empty">まだ入室したチームはありません</p>
    </main>

    <footer id="legend"></footer>

    <script>
      (() => {
        "use strict";

        const STOPS = ["Prologue", "S1", "S2", "S3", "S4", "S5", "S6", "Final"];
        // 10秒。3秒だと10チーム×2時間の集計だけで無料プランのD1 rows read
        // （500万/日）を使い切る（Issue #125）。会場前面の表示は10秒遅れで足りる。
        const POLL_MS = 10000;
        const TIMEOUT_MS = 4000;
        const STALE_MS = 5 * 60 * 1000;

        // タイルの形。チーム名（全角12文字まで）を2行で収めるため横長にする。
        const TILE_ASPECT = 2.2;
        const GAP_PX = 10;
        // 1行に並ぶ全角の文字数の目安（12文字を2行に割る）と、高さに対する文字の割合。
        const CHARS_PER_LINE = 6.6;
        const FONT_PER_HEIGHT = 0.32;

        const tiles = document.getElementById("tiles");
        const empty = document.getElementById("empty");
        const legend = document.getElementById("legend");
        const link = document.getElementById("link");
        const clock = document.getElementById("clock");

        let teamCount = 0;

        /**
         * D1の created_at は datetime('now') ＝ UTCの "YYYY-MM-DD HH:MM:SS"。
         * そのまま new Date() へ渡すと環境によってローカル時刻と解釈され、
         * 経過時間が時差ぶんずれる。TとZを補って必ずUTCとして読む。
         */
        const parseUtc = (value) => {
          if (typeof value !== "string" || value === "") return null;
          const time = Date.parse(value.replace(" ", "T") + "Z");
          return Number.isNaN(time) ? null : time;
        };

        const teamLabel = (team) => {
          const name = typeof team.teamName === "string" ? team.teamName.trim() : "";
          if (name !== "") return name;
          // サマリーは生のチームコードを返さない（publicId＝ハッシュの先頭8桁）。
          const id = String(team.publicId || "");
          return "チーム " + (id.length >= 2 ? id.slice(0, 2).toUpperCase() : id || "??");
        };

        const el = (tag, className, text) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        };

        /**
         * 列数を決める。どの列数でも全チームを入れた時の1タイルの幅と高さを出し、
         * 横長（TILE_ASPECT）の形に収めたときの大きさが最大になる列数を選ぶ。
         */
        const bestColumns = (count, width, height) => {
          let best = { cols: 1, size: -1 };
          for (let cols = 1; cols <= count; cols += 1) {
            const rows = Math.ceil(count / cols);
            const tileW = (width - GAP_PX * (cols - 1)) / cols;
            const tileH = (height - GAP_PX * (rows - 1)) / rows;
            const size = Math.min(tileW / TILE_ASPECT, tileH);
            if (size > best.size) best = { cols, size };
          }
          return best.cols;
        };

        /** 画面の大きさとチーム数から、列数・タイルの高さ・文字の大きさを決めて渡す。 */
        const layoutTiles = () => {
          if (teamCount === 0) return;
          const width = tiles.clientWidth;
          const height = tiles.clientHeight;
          const cols = bestColumns(teamCount, width, height);
          const rows = Math.ceil(teamCount / cols);
          const tileW = (width - GAP_PX * (cols - 1)) / cols;
          // 縦が余っても大きくしすぎない（少ないチームで巨大な帯にならない）。
          const tileH = Math.min((height - GAP_PX * (rows - 1)) / rows, tileW / 1.4);
          const font = Math.max(
            10,
            Math.min(tileH * FONT_PER_HEIGHT, (tileW * 0.9) / CHARS_PER_LINE),
          );
          tiles.style.setProperty("--cols", String(cols));
          tiles.style.setProperty("--tile-h", Math.floor(tileH) + "px");
          tiles.style.setProperty("--gap", GAP_PX + "px");
          tiles.style.setProperty("--tile-font", Math.floor(font) + "px");
        };

        const teamTile = (team, now) => {
          const pos = Math.min(STOPS.length - 1, Math.max(0, Number(team.pos) || 0));
          const updated = parseUtc(team.updatedAt);
          const stale = updated !== null && now - updated >= STALE_MS;
          const label = teamLabel(team);
          const tile = el("div", "tile p" + pos + (stale ? " stale" : ""));
          tile.title = label + "（" + STOPS[pos] + "）";
          tile.appendChild(el("span", "name", label));
          return tile;
        };

        const renderLegend = () => {
          STOPS.forEach((label, index) => {
            if (index > 0) legend.appendChild(el("span", "legend-arrow", "›"));
            legend.appendChild(el("span", "chip p" + index, label));
          });
          const note = el("span", "legend-note");
          note.appendChild(el("span", "swatch"));
          note.appendChild(document.createTextNode("5分以上更新なし"));
          legend.appendChild(note);
        };

        /** タイルはサーバの返す順（順位順）のまま、左上から並べる。 */
        const render = (summary) => {
          const now = Date.now();
          const teams = Array.isArray(summary.teams) ? summary.teams : [];
          teamCount = teams.length;
          tiles.textContent = "";
          tiles.hidden = teams.length === 0;
          empty.hidden = teams.length !== 0;
          teams.forEach((team) => {
            tiles.appendChild(teamTile(team, now));
          });
          layoutTiles();
        };

        /**
         * 取得に失敗しても前回の描画をそのまま残す（会場の盤面が空になるのが一番困る）。
         * ネットワークエラー（try/catch）とHTTPエラー（!ok）の両方を落ちたものとして扱い、
         * 右上に「接続断」を出す。次に成功したら消す。
         * 多重に走ると古い応答が新しい表示を上書きしうるので、実行中は次を見送る。
         */
        let pollInFlight = false;
        const poll = async () => {
          if (pollInFlight) return;
          pollInFlight = true;
          const controller = new AbortController();
          const timer = setTimeout(() => {
            controller.abort();
          }, TIMEOUT_MS);
          try {
            const response = await fetch("/api/progress/summary", {
              signal: controller.signal,
              headers: { Accept: "application/json" },
            });
            if (!response.ok) throw new Error("HTTP " + String(response.status));
            const summary = await response.json();
            render(summary);
            link.classList.remove("down");
          } catch {
            link.classList.add("down");
          } finally {
            clearTimeout(timer);
            pollInFlight = false;
          }
        };

        const tickClock = () => {
          const now = new Date();
          clock.textContent = [now.getHours(), now.getMinutes(), now.getSeconds()]
            .map((part) => String(part).padStart(2, "0"))
            .join(":");
        };

        renderLegend();
        render({ teams: [] });
        window.addEventListener("resize", layoutTiles);
        tickClock();
        setInterval(tickClock, 1000);

        /**
         * ポーリングはタブが見えている間だけ回す（hell-ict#22）。裏に回ったタブでも
         * D1を読み続けると無料プランの rows read を使い切る。見えたら1回すぐ取り直す。
         */
        let pollTimer = null;
        const startPolling = () => {
          if (pollTimer !== null) return;
          void poll();
          pollTimer = setInterval(() => {
            void poll();
          }, POLL_MS);
        };
        const stopPolling = () => {
          if (pollTimer === null) return;
          clearInterval(pollTimer);
          pollTimer = null;
        };
        const applyVisibility = () => {
          if (document.visibilityState === "visible") startPolling();
          else stopPolling();
        };
        document.addEventListener("visibilitychange", applyVisibility);
        applyVisibility();
      })();
    </script>
  </body>
</html>
