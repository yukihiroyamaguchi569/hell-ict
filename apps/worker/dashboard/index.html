<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>対策本部 進捗ボード | 地獄のICT</title>
    <!--
      会場前面ディスプレイ用の進捗ボード。単一ファイル・依存ゼロ・外部CDNなし。
      scripts/build-testplay.sh が public/dashboard.html としてコピーし、
      GET /api/progress/summary を3秒間隔でポーリングして描画する。
      参加者ではなくファシリテーターが見る画面なので、罠の種明かしは書かない。
    -->
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121924;
        --panel-edge: #1e2a3a;
        --ink: #e8eef6;
        --ink-dim: #8ea0b8;
        --accent: #4cc2ff;
        --done: #2f6f4f;
        --done-ink: #7ee2ac;
        --alert: #ff6b5e;
        --warn: #f5b942;
        --track-empty: #1a2432;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Hiragino Kaku Gothic ProN",
          "Yu Gothic",
          "Meiryo",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: clamp(15px, 1.15vw, 21px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 1em;
        padding: 0.7em 1.2em;
        border-bottom: 2px solid var(--panel-edge);
        background: linear-gradient(180deg, #101722, #0b0f14);
      }
      .sign {
        font-size: 1.05em;
        letter-spacing: 0.16em;
        color: var(--ink-dim);
      }
      h1 {
        margin: 0;
        font-size: 1.7em;
        letter-spacing: 0.06em;
      }
      h1 .em {
        color: var(--accent);
      }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.9em;
        font-variant-numeric: tabular-nums;
      }
      .clock {
        font-size: 1.5em;
        letter-spacing: 0.04em;
      }
      .link {
        display: none;
        align-items: center;
        gap: 0.4em;
        padding: 0.25em 0.8em;
        border-radius: 999px;
        background: rgba(255, 107, 94, 0.15);
        border: 1px solid var(--alert);
        color: var(--alert);
        font-weight: 700;
      }
      .link.down {
        display: flex;
      }
      .link::before {
        content: "";
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        background: var(--alert);
        animation: blink 1.1s steps(2, start) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.15;
        }
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 0.9em 1.2em;
        display: flex;
        flex-direction: column;
        gap: 0.55em;
      }
      .empty {
        margin: auto;
        text-align: center;
        color: var(--ink-dim);
        font-size: 1.3em;
        line-height: 1.9;
      }

      .team {
        display: grid;
        grid-template-columns: minmax(9em, 15em) 1fr auto;
        align-items: center;
        gap: 1.1em;
        padding: 0.6em 1em;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-left: 5px solid var(--accent);
        border-radius: 10px;
      }
      .team.stale {
        opacity: 0.55;
        border-left-color: var(--warn);
      }
      .team.goal {
        border-left-color: var(--done-ink);
        background: linear-gradient(90deg, rgba(126, 226, 172, 0.12), var(--panel));
      }
      .name {
        font-size: 1.35em;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .code {
        display: block;
        font-size: 0.6em;
        font-weight: 400;
        color: var(--ink-dim);
        letter-spacing: 0.1em;
      }

      .track {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 0.35em;
      }
      .stop {
        position: relative;
        text-align: center;
        padding: 0.4em 0.1em;
        border-radius: 6px;
        background: var(--track-empty);
        color: var(--ink-dim);
        font-size: 0.9em;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
        overflow: hidden;
      }
      .stop.passed {
        background: var(--done);
        color: var(--done-ink);
      }
      .stop.here {
        background: var(--accent);
        color: #05121c;
        box-shadow: 0 0 0 2px rgba(76, 194, 255, 0.35);
      }

      .since {
        text-align: right;
        font-size: 1.05em;
        color: var(--ink-dim);
        font-variant-numeric: tabular-nums;
        min-width: 5.5em;
      }
      .since.stale {
        color: var(--warn);
      }

      footer {
        border-top: 2px solid var(--panel-edge);
        background: #0d131b;
        padding: 0.55em 1.2em;
        display: flex;
        align-items: center;
        gap: 1em;
        min-height: 2.8em;
      }
      .tag {
        flex: none;
        font-size: 0.85em;
        letter-spacing: 0.14em;
        color: var(--ink-dim);
        border: 1px solid var(--panel-edge);
        border-radius: 4px;
        padding: 0.2em 0.6em;
      }
      .ticker {
        display: flex;
        gap: 1.6em;
        overflow: hidden;
        white-space: nowrap;
        color: var(--ink);
        font-size: 1.05em;
      }
      .ticker span {
        flex: none;
      }
      .ticker .t-time {
        color: var(--ink-dim);
        margin-right: 0.4em;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="sign">聖クロノス総合病院</div>
        <h1>感染制御<span class="em">対策本部</span> 進捗ボード</h1>
      </div>
      <div class="status">
        <div class="link" id="link">接続断</div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <main id="board">
      <p class="empty" id="empty">
        まだどのチームも入室していません。<br />
        参加者が最初の画面を開くと、この盤面が動き出します。
      </p>
    </main>

    <footer>
      <div class="tag">通信記録</div>
      <div class="ticker" id="ticker"></div>
    </footer>

    <script>
      (() => {
        "use strict";

        const STOPS = ["Prologue", "S1", "S2", "S3", "S4", "S5", "S6", "Final"];
        const POLL_MS = 3000;
        const TIMEOUT_MS = 4000;
        const STALE_MS = 5 * 60 * 1000;

        const board = document.getElementById("board");
        const empty = document.getElementById("empty");
        const ticker = document.getElementById("ticker");
        const link = document.getElementById("link");
        const clock = document.getElementById("clock");

        /**
         * D1の created_at は datetime('now') ＝ UTCの "YYYY-MM-DD HH:MM:SS"。
         * そのまま new Date() へ渡すと環境によってローカル時刻と解釈され、
         * 経過時間が時差ぶんずれる。TとZを補って必ずUTCとして読む。
         */
        const parseUtc = (value) => {
          if (typeof value !== "string" || value === "") return null;
          const time = Date.parse(value.replace(" ", "T") + "Z");
          return Number.isNaN(time) ? null : time;
        };

        const sinceText = (time, now) => {
          if (time === null) return "—";
          const sec = Math.max(0, Math.floor((now - time) / 1000));
          if (sec < 60) return sec + "秒前";
          const min = Math.floor(sec / 60);
          if (min < 60) return min + "分前";
          return Math.floor(min / 60) + "時間" + (min % 60) + "分前";
        };

        const teamLabel = (team) => {
          const name = typeof team.teamName === "string" ? team.teamName.trim() : "";
          if (name !== "") return name;
          // サマリーは生のチームコードを返さない（publicId＝ハッシュの先頭8桁）。
          const id = String(team.publicId || "");
          return "チーム " + (id.length >= 2 ? id.slice(0, 2).toUpperCase() : id || "??");
        };

        const el = (tag, className, text) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        };

        const teamRow = (team, now) => {
          const pos = Math.min(STOPS.length - 1, Math.max(0, Number(team.pos) || 0));
          const updated = parseUtc(team.updatedAt);
          const stale = updated !== null && now - updated >= STALE_MS;

          const row = el("div", "team" + (stale ? " stale" : "") + (pos >= 7 ? " goal" : ""));

          const name = el("div", "name", teamLabel(team));
          name.appendChild(el("span", "code", "No." + String(team.publicId || "--------")));
          row.appendChild(name);

          const track = el("div", "track");
          STOPS.forEach((label, index) => {
            const state = index === pos ? " here" : index < pos ? " passed" : "";
            track.appendChild(el("div", "stop" + state, label));
          });
          row.appendChild(track);

          row.appendChild(el("div", "since" + (stale ? " stale" : ""), sinceText(updated, now)));
          return row;
        };

        const KIND_TEXT = { clear: "を突破", entry: "に到着", jump: "へ移動", resume: "へ復帰" };

        const eventText = (event) => {
          const pos = Math.min(STOPS.length - 1, Math.max(0, Number(event.pos) || 0));
          const verb = KIND_TEXT[event.kind] || "を通過";
          return teamLabel(event) + " が " + STOPS[pos] + " " + verb;
        };

        const eventTime = (event) => {
          const time = parseUtc(event.createdAt);
          if (time === null) return "--:--";
          const at = new Date(time);
          return (
            String(at.getHours()).padStart(2, "0") + ":" + String(at.getMinutes()).padStart(2, "0")
          );
        };

        const render = (summary) => {
          const now = Date.now();
          const teams = Array.isArray(summary.teams) ? summary.teams : [];
          const events = Array.isArray(summary.events) ? summary.events : [];

          board.textContent = "";
          if (teams.length === 0) {
            board.appendChild(empty);
          } else {
            teams.forEach((team) => {
              board.appendChild(teamRow(team, now));
            });
          }

          ticker.textContent = "";
          events.forEach((event) => {
            const item = el("span");
            item.appendChild(el("span", "t-time", eventTime(event)));
            item.appendChild(document.createTextNode(eventText(event)));
            ticker.appendChild(item);
          });
        };

        /**
         * 取得に失敗しても前回の描画をそのまま残す（会場の盤面が空になるのが一番困る）。
         * ネットワークエラー（try/catch）とHTTPエラー（!ok）の両方を落ちたものとして扱い、
         * 右上に「接続断」を出す。次に成功したら消す。
         *
         * ポーリング間隔(3秒)よりタイムアウト(4秒)が長いので、前回が終わらないうちに
         * 次の番が来る。多重に走らせると、遅れて返ってきた古い応答が新しい表示を
         * 上書きしたり、古い失敗が成功後に「接続断」を点け直したりする。
         * 実行中は次を見送り、1本だけが走るようにする。
         */
        let pollInFlight = false;
        const poll = async () => {
          if (pollInFlight) return;
          pollInFlight = true;
          const controller = new AbortController();
          const timer = setTimeout(() => {
            controller.abort();
          }, TIMEOUT_MS);
          try {
            const response = await fetch("/api/progress/summary", {
              signal: controller.signal,
              headers: { Accept: "application/json" },
            });
            if (!response.ok) throw new Error("HTTP " + String(response.status));
            const summary = await response.json();
            render(summary);
            link.classList.remove("down");
          } catch {
            link.classList.add("down");
          } finally {
            clearTimeout(timer);
            pollInFlight = false;
          }
        };

        const tickClock = () => {
          const now = new Date();
          clock.textContent = [now.getHours(), now.getMinutes(), now.getSeconds()]
            .map((part) => String(part).padStart(2, "0"))
            .join(":");
        };

        tickClock();
        setInterval(tickClock, 1000);
        void poll();
        setInterval(() => {
          void poll();
        }, POLL_MS);
      })();
    </script>
  </body>
</html>
