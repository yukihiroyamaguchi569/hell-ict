<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%95%B9%EF%B8%8F</text></svg>"
    />
    <title>対策本部 進捗ボード | 地獄のICT</title>
    <!--
      会場前面ディスプレイ用の進捗ボード。単一ファイル・依存ゼロ・外部CDNなし。
      scripts/build-testplay.sh が public/dashboard.html としてコピーし、
      GET /api/progress/summary を10秒間隔でポーリングして描画する。
      参加者ではなくファシリテーターが見る画面なので、罠の種明かしは書かない。
    -->
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #121924;
        --panel-edge: #1e2a3a;
        --ink: #e8eef6;
        --ink-dim: #8ea0b8;
        --accent: #4cc2ff;
        --done: #2f6f4f;
        --done-ink: #7ee2ac;
        --alert: #ff6b5e;
        --warn: #f5b942;
        --track-empty: #1a2432;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Hiragino Kaku Gothic ProN",
          "Yu Gothic",
          "Meiryo",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: clamp(15px, 1.15vw, 21px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 1em;
        padding: 0.7em 1.2em;
        border-bottom: 2px solid var(--panel-edge);
        background: linear-gradient(180deg, #101722, #0b0f14);
      }
      .sign {
        font-size: 1.05em;
        letter-spacing: 0.16em;
        color: var(--ink-dim);
      }
      h1 {
        margin: 0;
        font-size: 1.7em;
        letter-spacing: 0.06em;
      }
      h1 .em {
        color: var(--accent);
      }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 0.9em;
        font-variant-numeric: tabular-nums;
      }
      .clock {
        font-size: 1.5em;
        letter-spacing: 0.04em;
      }
      /*
        残り時間のカウントダウン。会場の進行役がこの画面で操作する。
        状態はこのブラウザの localStorage にだけ置き、サーバーとは同期しない。
      */
      .timer {
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 0.8em;
        font-variant-numeric: tabular-nums;
      }
      .timer-label {
        color: var(--ink-dim);
        letter-spacing: 0.14em;
      }
      .timer-display {
        font-size: 2.4em;
        font-weight: 700;
        letter-spacing: 0.04em;
        min-width: 3.4em;
        text-align: center;
      }
      .timer.warning .timer-display {
        color: var(--alert);
        animation: blink 1.1s steps(2, start) infinite;
      }
      .timer.finished .timer-display {
        color: var(--ink-dim);
      }
      .timer-end {
        display: none;
        color: var(--alert);
        font-weight: 700;
      }
      .timer.finished .timer-end {
        display: inline;
      }
      .timer-controls {
        display: flex;
        align-items: center;
        gap: 0.4em;
        font-size: 0.85em;
      }
      .timer-controls input {
        width: 4em;
        padding: 0.25em 0.4em;
        border-radius: 6px;
        border: 1px solid var(--panel-edge);
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        text-align: right;
      }
      .timer-controls button {
        padding: 0.3em 0.8em;
        border-radius: 6px;
        border: 1px solid var(--panel-edge);
        background: var(--panel);
        color: var(--ink-dim);
        font: inherit;
        cursor: pointer;
      }
      .timer-controls button:not([disabled]):hover {
        border-color: var(--ink-dim);
        color: var(--ink);
      }
      .timer-controls button[disabled],
      .timer-controls input[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .link {
        display: none;
        align-items: center;
        gap: 0.4em;
        padding: 0.25em 0.8em;
        border-radius: 999px;
        background: rgba(255, 107, 94, 0.15);
        border: 1px solid var(--alert);
        color: var(--alert);
        font-weight: 700;
      }
      .link.down {
        display: flex;
      }
      .link::before {
        content: "";
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        background: var(--alert);
        animation: blink 1.1s steps(2, start) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.15;
        }
      }

      main {
        flex: 1;
        overflow-y: auto;
        padding: 0.9em 1.2em;
        display: flex;
        flex-direction: column;
        gap: 0.55em;
      }
      .empty {
        margin: auto;
        text-align: center;
        color: var(--ink-dim);
        font-size: 1.3em;
        line-height: 1.9;
      }

      /* GMモード（URLハッシュ #gm）でだけ出す操作列。通常表示では一切描画しない。 */
      .gmbar {
        display: flex;
        align-items: center;
        gap: 0.7em;
        padding: 0.5em 1.2em;
        border-bottom: 2px solid var(--panel-edge);
        background: #171008;
        color: var(--warn);
        font-size: 0.95em;
      }
      /* display:flexは[hidden]の display:none より強い。明示的に消す。 */
      .gmbar[hidden] {
        display: none;
      }
      .gmbar input {
        flex: 1;
        max-width: 26em;
        padding: 0.35em 0.6em;
        border-radius: 6px;
        border: 1px solid var(--panel-edge);
        background: var(--panel);
        color: var(--ink);
        font: inherit;
      }
      .gmbar button,
      .gm button {
        padding: 0.35em 0.9em;
        border-radius: 6px;
        border: 1px solid var(--alert);
        background: rgba(255, 107, 94, 0.15);
        color: var(--alert);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .gmbar button {
        border-color: var(--warn);
        background: rgba(245, 185, 66, 0.15);
        color: var(--warn);
      }
      .gm button[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .gm {
        display: flex;
        align-items: center;
        gap: 0.6em;
        min-width: 12em;
        justify-content: flex-end;
      }
      .gm .note {
        font-size: 0.85em;
        color: var(--ink-dim);
      }

      .team {
        display: grid;
        grid-template-columns: 3.2em minmax(9em, 15em) 1fr auto;
        align-items: center;
        gap: 1.1em;
        padding: 0.6em 1em;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-left: 5px solid var(--accent);
        border-radius: 10px;
      }
      .team.stale {
        opacity: 0.55;
        border-left-color: var(--warn);
      }
      .team.gm {
        grid-template-columns: 3.2em minmax(9em, 15em) 1fr auto auto;
      }
      .team.goal {
        border-left-color: var(--done-ink);
        background: linear-gradient(90deg, rgba(126, 226, 172, 0.12), var(--panel));
      }
      /* 順位。サマリーは停留所の先頭から到達順に並べて返すので、上から数えた番号。 */
      .rank {
        font-size: 1.5em;
        font-weight: 700;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .rank small {
        font-size: 0.6em;
        margin-left: 0.1em;
        color: var(--ink-dim);
      }
      .team.goal .rank {
        color: var(--done-ink);
      }
      .name {
        font-size: 1.35em;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .code {
        display: block;
        font-size: 0.6em;
        font-weight: 400;
        color: var(--ink-dim);
        letter-spacing: 0.1em;
      }

      .track {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 0.35em;
      }
      .stop {
        position: relative;
        text-align: center;
        padding: 0.4em 0.1em;
        border-radius: 6px;
        background: var(--track-empty);
        color: var(--ink-dim);
        font-size: 0.9em;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
        overflow: hidden;
      }
      .stop.passed {
        background: var(--done);
        color: var(--done-ink);
      }
      .stop.here {
        background: var(--accent);
        color: #05121c;
        box-shadow: 0 0 0 2px rgba(76, 194, 255, 0.35);
      }

      .since {
        text-align: right;
        font-size: 1.05em;
        color: var(--ink-dim);
        font-variant-numeric: tabular-nums;
        min-width: 5.5em;
      }
      .since.stale {
        color: var(--warn);
      }

      footer {
        border-top: 2px solid var(--panel-edge);
        background: #0d131b;
        padding: 0.55em 1.2em;
        display: flex;
        align-items: center;
        gap: 1em;
        min-height: 2.8em;
      }
      .tag {
        flex: none;
        font-size: 0.85em;
        letter-spacing: 0.14em;
        color: var(--ink-dim);
        border: 1px solid var(--panel-edge);
        border-radius: 4px;
        padding: 0.2em 0.6em;
      }
      .ticker {
        display: flex;
        gap: 1.6em;
        overflow: hidden;
        white-space: nowrap;
        color: var(--ink);
        font-size: 1.05em;
      }
      .ticker span {
        flex: none;
      }
      .ticker .t-time {
        color: var(--ink-dim);
        margin-right: 0.4em;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="sign">聖クロノス総合病院</div>
        <h1>感染制御<span class="em">対策本部</span> 進捗ボード</h1>
      </div>
      <div class="timer" id="timer">
        <span class="timer-label">残り</span>
        <span class="timer-display" id="timer-display">80:00</span>
        <span class="timer-end">時間切れ</span>
        <div class="timer-controls">
          <input
            id="timer-minutes"
            type="number"
            min="1"
            max="999"
            step="1"
            value="80"
            aria-label="制限時間（分）"
          />
          <span>分</span>
          <button type="button" id="timer-toggle">スタート</button>
          <button type="button" id="timer-reset">初期値に戻す</button>
        </div>
      </div>
      <div class="status">
        <div class="link" id="link">接続断</div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <div class="gmbar" id="gmbar" hidden>
      <label for="gm-token">GMトークン</label>
      <input id="gm-token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN" />
      <button type="button" id="gm-save">保存</button>
      <span id="gm-status"></span>
    </div>

    <main id="board">
      <p class="empty" id="empty">
        まだどのチームも入室していません。<br />
        参加者が最初の画面を開くと、この盤面が動き出します。
      </p>
    </main>

    <footer>
      <div class="tag">通信記録</div>
      <div class="ticker" id="ticker"></div>
    </footer>

    <script>
      (() => {
        "use strict";

        const STOPS = ["Prologue", "S1", "S2", "S3", "S4", "S5", "S6", "Final"];
        // 10秒。3秒だと10チーム×2時間の集計だけで無料プランのD1 rows read
        // （500万/日）を使い切る（Issue #125）。会場前面の表示は10秒遅れで足りる。
        const POLL_MS = 10000;
        const TIMEOUT_MS = 4000;
        const STALE_MS = 5 * 60 * 1000;

        const board = document.getElementById("board");
        const empty = document.getElementById("empty");
        const ticker = document.getElementById("ticker");
        const link = document.getElementById("link");
        const clock = document.getElementById("clock");
        const gmbar = document.getElementById("gmbar");
        const gmToken = document.getElementById("gm-token");
        const gmSave = document.getElementById("gm-save");
        const gmStatus = document.getElementById("gm-status");

        /**
         * GMモード。URLハッシュが #gm のときだけ、トークン欄と各行のリセットボタンを出す。
         * 会場前面へ映すのは通常表示なので、ハッシュが無ければ何も描画しない。
         *
         * トークン（ADMIN_TOKEN）はこのブラウザの localStorage にだけ置く。プライベート
         * ウィンドウやストレージ禁止の設定では例外が飛ぶので、読み書きとも握りつぶして
         * 「入力はできるが覚えない」状態へ倒す（盤面そのものは動き続ける）。
         */
        const GM_HASH = "#gm";
        const TOKEN_KEY = "hellIctAdminToken";
        const RESET_TIMEOUT_MS = 8000;
        const NOTE_MS = 20000;

        const readToken = () => {
          try {
            return localStorage.getItem(TOKEN_KEY) || "";
          } catch {
            return "";
          }
        };
        const persistToken = (value) => {
          try {
            localStorage.setItem(TOKEN_KEY, value);
            return true;
          } catch {
            return false;
          }
        };

        // 実際に送るのはこの変数。localStorageへ保存できない環境でも、開いている間は使える。
        let adminToken = readToken();
        let gmMode = location.hash === GM_HASH;
        let lastSummary = { teams: [], events: [] };
        // publicId -> { text, at }。ポーリングごとの再描画で消えないよう、結果はここへ残す。
        const resetNotes = new Map();
        // 実行中の publicId。行ノードではなくここで持つ——ポーリングのたびに行を
        // 作り直すので、ボタンのdisabledをノードに預けると再描画で押せる状態に戻り、
        // 同じチームを二重にリセットできてしまう。
        const resetInFlight = new Set();

        /**
         * D1の created_at は datetime('now') ＝ UTCの "YYYY-MM-DD HH:MM:SS"。
         * そのまま new Date() へ渡すと環境によってローカル時刻と解釈され、
         * 経過時間が時差ぶんずれる。TとZを補って必ずUTCとして読む。
         */
        const parseUtc = (value) => {
          if (typeof value !== "string" || value === "") return null;
          const time = Date.parse(value.replace(" ", "T") + "Z");
          return Number.isNaN(time) ? null : time;
        };

        const sinceText = (time, now) => {
          if (time === null) return "—";
          const sec = Math.max(0, Math.floor((now - time) / 1000));
          if (sec < 60) return sec + "秒前";
          const min = Math.floor(sec / 60);
          if (min < 60) return min + "分前";
          return Math.floor(min / 60) + "時間" + (min % 60) + "分前";
        };

        const teamLabel = (team) => {
          const name = typeof team.teamName === "string" ? team.teamName.trim() : "";
          if (name !== "") return name;
          // サマリーは生のチームコードを返さない（publicId＝ハッシュの先頭8桁）。
          const id = String(team.publicId || "");
          return "チーム " + (id.length >= 2 ? id.slice(0, 2).toUpperCase() : id || "??");
        };

        const el = (tag, className, text) => {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        };

        /**
         * 順位は並びの位置（1始まり）。サーバが pos の大きい順、同じ pos の中は到達の早い順に
         * 並べて返す（Issue #159）。同着は時刻が完全に一致したときだけで、そのときも連番にする
         * ——並びはチームコードで固定されるので、ポーリングのたびに番号が入れ替わることはない。
         */
        const rankCell = (rank) => {
          const cell = el("div", "rank", String(rank));
          cell.appendChild(el("small", null, "位"));
          return cell;
        };

        const teamRow = (team, now, rank) => {
          const pos = Math.min(STOPS.length - 1, Math.max(0, Number(team.pos) || 0));
          const updated = parseUtc(team.updatedAt);
          const stale = updated !== null && now - updated >= STALE_MS;

          const row = el(
            "div",
            "team" + (stale ? " stale" : "") + (pos >= 7 ? " goal" : "") + (gmMode ? " gm" : ""),
          );

          row.appendChild(rankCell(rank));

          const name = el("div", "name", teamLabel(team));
          name.appendChild(el("span", "code", "No." + String(team.publicId || "--------")));
          row.appendChild(name);

          const track = el("div", "track");
          STOPS.forEach((label, index) => {
            const state = index === pos ? " here" : index < pos ? " passed" : "";
            track.appendChild(el("div", "stop" + state, label));
          });
          row.appendChild(track);

          row.appendChild(el("div", "since" + (stale ? " stale" : ""), sinceText(updated, now)));
          if (gmMode) row.appendChild(gmCell(team));
          return row;
        };

        const KIND_TEXT = { clear: "を突破", entry: "に到着", jump: "へ移動", resume: "へ復帰" };

        const eventText = (event) => {
          // resetはチームが動いた記録ではなくGMの操作なので、停留所の文型に載せない
          // （そのまま流すと pos 0 の行が「Prologue を通過」と読めてしまう）。
          if (event.kind === "reset") return teamLabel(event) + " 〔GM〕初期状態に戻しました";
          const pos = Math.min(STOPS.length - 1, Math.max(0, Number(event.pos) || 0));
          const verb = KIND_TEXT[event.kind] || "を通過";
          return teamLabel(event) + " が " + STOPS[pos] + " " + verb;
        };

        const eventTime = (event) => {
          const time = parseUtc(event.createdAt);
          if (time === null) return "--:--";
          const at = new Date(time);
          return (
            String(at.getHours()).padStart(2, "0") + ":" + String(at.getMinutes()).padStart(2, "0")
          );
        };

        /**
         * リセットAPIを叩く。ダッシュボードはチームコードを表示しない設計なので、
         * 対象は publicId（サマリーが返すハッシュの先頭8桁）で指す。
         *
         * ポーリングと同じく、ネットワークエラー（try/catch）とHTTPエラー（!ok）の
         * 両方を落ちたものとして扱い、AbortControllerでタイムアウトも切る。
         * 404は「トークンが違う」と「そのチームは居ない」を区別しない応答なので、
         * 現場でまず疑うべきトークン側の案内へ寄せる。
         */
        const requestReset = async (publicId) => {
          const controller = new AbortController();
          const timer = setTimeout(() => {
            controller.abort();
          }, RESET_TIMEOUT_MS);
          try {
            const response = await fetch(
              "/api/gm/teams/by-public-id/" + encodeURIComponent(publicId) + "/reset",
              {
                method: "POST",
                signal: controller.signal,
                headers: { Authorization: "Bearer " + adminToken },
              },
            );
            if (response.status === 404) return "トークンを確認してください";
            if (!response.ok) return "失敗（HTTP " + String(response.status) + "）";
            return "リセットしました";
          } catch {
            return "通信に失敗しました";
          } finally {
            clearTimeout(timer);
          }
        };

        const noteFor = (publicId) => {
          const note = resetNotes.get(publicId);
          if (note === undefined) return "";
          if (Date.now() - note.at > NOTE_MS) {
            resetNotes.delete(publicId);
            return "";
          }
          return note.text;
        };

        const gmCell = (team) => {
          const publicId = String(team.publicId || "");
          const running = resetInFlight.has(publicId);
          const cell = el("div", "gm");
          const button = el("button", null, "リセット");
          button.type = "button";
          // 再描画で作り直された行にも、実行中なら最初からdisabledで描く。
          button.disabled = running;
          const note = el("span", "note", running ? "実行中…" : noteFor(publicId));
          button.addEventListener("click", () => {
            if (resetInFlight.has(publicId)) return;
            if (!confirm("チーム " + teamLabel(team) + " を初期状態に戻します。よろしいですか？"))
              return;
            resetInFlight.add(publicId);
            button.disabled = true;
            note.textContent = "実行中…";
            void requestReset(publicId).then((text) => {
              // 成否によらず必ず外す。残すと以後そのチームを二度と押せなくなる。
              resetInFlight.delete(publicId);
              resetNotes.set(publicId, { text, at: Date.now() });
              note.textContent = text;
              button.disabled = false;
            });
          });
          cell.appendChild(button);
          cell.appendChild(note);
          return cell;
        };

        const render = (summary) => {
          lastSummary = summary;
          const now = Date.now();
          const teams = Array.isArray(summary.teams) ? summary.teams : [];
          const events = Array.isArray(summary.events) ? summary.events : [];

          board.textContent = "";
          if (teams.length === 0) {
            board.appendChild(empty);
          } else {
            teams.forEach((team, index) => {
              board.appendChild(teamRow(team, now, index + 1));
            });
          }

          ticker.textContent = "";
          events.forEach((event) => {
            const item = el("span");
            item.appendChild(el("span", "t-time", eventTime(event)));
            item.appendChild(document.createTextNode(eventText(event)));
            ticker.appendChild(item);
          });
        };

        /**
         * 取得に失敗しても前回の描画をそのまま残す（会場の盤面が空になるのが一番困る）。
         * ネットワークエラー（try/catch）とHTTPエラー（!ok）の両方を落ちたものとして扱い、
         * 右上に「接続断」を出す。次に成功したら消す。
         *
         * ポーリング間隔(10秒)はタイムアウト(4秒)より長いので、通常は前回が終わって
         * から次の番が来る。それでも1本だけに絞るのは、背面タブから復帰したときの
         * setIntervalのまとめ発火や、間隔を詰めたときに重なりうるため。多重に走ると、
         * 遅れて返ってきた古い応答が新しい表示を上書きしたり、古い失敗が成功後に
         * 「接続断」を点け直したりする。実行中は次を見送る。
         */
        let pollInFlight = false;
        const poll = async () => {
          if (pollInFlight) return;
          pollInFlight = true;
          const controller = new AbortController();
          const timer = setTimeout(() => {
            controller.abort();
          }, TIMEOUT_MS);
          try {
            const response = await fetch("/api/progress/summary", {
              signal: controller.signal,
              headers: { Accept: "application/json" },
            });
            if (!response.ok) throw new Error("HTTP " + String(response.status));
            const summary = await response.json();
            render(summary);
            link.classList.remove("down");
          } catch {
            link.classList.add("down");
          } finally {
            clearTimeout(timer);
            pollInFlight = false;
          }
        };

        /**
         * 残り時間のタイマー。走っている間は「終わる時刻」を持ち、残りは毎秒そこから引き直す。
         * 1秒ずつ減らす方式だと、タブが裏に回ってsetIntervalが間引かれたときに遅れるため。
         * 状態は localStorage に置き、再読み込みしても続きから動く（保存できなくても動き続ける）。
         */
        const TIMER_KEY = "hellIctDashboardTimer";
        const DEFAULT_MINUTES = 80;
        const MAX_MINUTES = 999;
        const WARNING_MS = 10 * 60 * 1000;

        const isMinutes = (value) => Number.isInteger(value) && value >= 1 && value <= MAX_MINUTES;

        const initialTimer = (minutes) => ({ minutes, remainingMs: minutes * 60000, endsAt: null });

        /** localStorage から読んだ値は形を確かめてから使う。壊れていれば初期値へ戻す。 */
        const parseTimer = (raw) => {
          try {
            const data = JSON.parse(raw);
            if (!data || !isMinutes(data.minutes)) return null;
            if (!Number.isFinite(data.remainingMs) || data.remainingMs < 0) return null;
            if (data.endsAt !== null && !Number.isFinite(data.endsAt)) return null;
            return { minutes: data.minutes, remainingMs: data.remainingMs, endsAt: data.endsAt };
          } catch {
            return null;
          }
        };

        const remainingOf = (state, now) =>
          state.endsAt === null ? state.remainingMs : Math.max(0, state.endsAt - now);

        const formatRemaining = (ms) => {
          const total = Math.ceil(ms / 1000);
          return (
            String(Math.floor(total / 60)).padStart(2, "0") +
            ":" +
            String(total % 60).padStart(2, "0")
          );
        };

        const timerBox = document.getElementById("timer");
        const timerDisplay = document.getElementById("timer-display");
        const timerMinutes = document.getElementById("timer-minutes");
        const timerToggle = document.getElementById("timer-toggle");
        const timerReset = document.getElementById("timer-reset");

        const loadTimer = () => {
          try {
            return parseTimer(localStorage.getItem(TIMER_KEY)) || initialTimer(DEFAULT_MINUTES);
          } catch {
            return initialTimer(DEFAULT_MINUTES);
          }
        };
        let timerState = loadTimer();

        /**
         * 残り時間が10分の倍数（…, 20:00, 10:00, 00:00）に達するたびに流すアナウンス。「鳴らし済みの区切り」を持ち、
         * 走行中に残りが新しい区切りを下向きにまたいだら1回だけ読み上げる（スタート時点の残りがちょうど倍数でも読まない）。
         * 読み込み直後・初期値に戻す・分数変更では現在の残りに合わせるだけで、過ぎた区切りは遡って読まない。
         * 読み上げはブラウザ内蔵の Web Speech API。使えない環境では Web Audio で合成したチャイムに替える。
         * どちらもクリックが無いと鳴らせないため、ページ上のクリックで用意する
         * （再読み込み後は、どこかを一度クリックするまで鳴らない）。音が出せなくてもタイマーは止めない。
         */
        const CHIME_INTERVAL_MS = 10 * 60 * 1000;
        // 残りが減って区切りをまたぐと1増える（残り10:00ちょうどで増え、10:01ではまだ増えない）。
        const chimeMarkOf = (state, now) => -Math.ceil(remainingOf(state, now) / CHIME_INTERVAL_MS);
        let chimedMark = chimeMarkOf(timerState, Date.now());
        let audioContext = null;

        let speechUnlocked = false;

        const prepareAudio = () => {
          // 読み上げもユーザー操作の後でないと無視されるため、最初のクリックで空の発話を1回流して解錠する。
          if (!speechUnlocked && canSpeak()) {
            speechUnlocked = true;
            try {
              window.speechSynthesis.speak(new window.SpeechSynthesisUtterance(""));
            } catch {
              // 解錠できなくても、タイマーはそのまま動く。
            }
          }
          try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            if (!audioContext) audioContext = new AudioContextClass();
            if (audioContext.state === "suspended") audioContext.resume().catch(() => {});
          } catch {
            // 音が出せない環境でも、タイマーはそのまま動く。
          }
        };

        const playChime = () => {
          // 止まったままの AudioContext に予約すると、再開した瞬間に溜まった分がまとめて鳴るので飛ばす。
          if (!audioContext || audioContext.state !== "running") return;
          try {
            const start = audioContext.currentTime;
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = "sine";
            oscillator.frequency.value = 880;
            // 立ち上がりは短く、1.4秒かけて指数的に消える「ピーン」。
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.4);
            oscillator.connect(gain).connect(audioContext.destination);
            oscillator.start(start);
            oscillator.stop(start + 1.4);
          } catch {
            // 鳴らせなくても、タイマーはそのまま動く。
          }
        };

        const announcementText = (minutes, remainingMin) =>
          remainingMin > 0
            ? `${minutes - remainingMin}分経過、のこり${remainingMin}分です`
            : `${minutes}分経過、ゲーム終了です`;

        const canSpeak = () =>
          Boolean(window.speechSynthesis) && typeof window.SpeechSynthesisUtterance === "function";

        // 声は Kyoko を優先し、無ければ日本語の声、それも無ければ lang 指定だけでブラウザに任せる。
        let speechVoice = null;
        const pickVoice = () => {
          try {
            const voices = window.speechSynthesis.getVoices();
            speechVoice =
              voices.find((voice) => voice.name.includes("Kyoko")) ||
              voices.find((voice) => voice.lang.replace("_", "-") === "ja-JP") ||
              null;
          } catch {
            speechVoice = null;
          }
        };
        // 声の一覧は後から届くことがあるので、届いたら選び直す。
        if (canSpeak()) {
          pickVoice();
          try {
            window.speechSynthesis.addEventListener("voiceschanged", pickVoice);
          } catch {
            // 取り直せなくても、lang 指定だけで読み上げる。
          }
        }

        const announce = (text) => {
          if (!canSpeak()) {
            playChime();
            return;
          }
          try {
            const utterance = new window.SpeechSynthesisUtterance(text);
            utterance.lang = "ja-JP";
            if (speechVoice) utterance.voice = speechVoice;
            // 前の読み上げが残っていても重ねない。
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
          } catch {
            playChime();
          }
        };

        const setTimer = (next) => {
          timerState = next;
          try {
            localStorage.setItem(TIMER_KEY, JSON.stringify(next));
          } catch {
            // 保存できなくても、このタブを開いている間は動く。
          }
          renderTimer();
        };

        const renderTimer = () => {
          const now = Date.now();
          const remaining = remainingOf(timerState, now);
          // 時間切れと区切りが重なっても、止める前にここで1回だけ読み上げる（止めた後は走っていないので読まない）。
          const mark = chimeMarkOf(timerState, now);
          if (timerState.endsAt !== null && mark > chimedMark)
            announce(announcementText(timerState.minutes, -mark * 10));
          chimedMark = mark;
          // 0に達したら止まった状態へ落とす（再読み込みしても時間切れのまま）。
          if (timerState.endsAt !== null && remaining === 0) {
            setTimer({ minutes: timerState.minutes, remainingMs: 0, endsAt: null });
            return;
          }
          const running = timerState.endsAt !== null;
          timerDisplay.textContent = formatRemaining(remaining);
          timerBox.classList.toggle("finished", remaining === 0);
          timerBox.classList.toggle("warning", remaining > 0 && remaining <= WARNING_MS);
          timerToggle.textContent = running ? "一時停止" : "スタート";
          timerToggle.disabled = remaining === 0;
          timerMinutes.disabled = running;
          if (document.activeElement !== timerMinutes)
            timerMinutes.value = String(timerState.minutes);
        };

        document.addEventListener("click", prepareAudio);
        timerToggle.addEventListener("click", () => {
          const now = Date.now();
          const remaining = remainingOf(timerState, now);
          setTimer(
            timerState.endsAt === null
              ? { minutes: timerState.minutes, remainingMs: remaining, endsAt: now + remaining }
              : { minutes: timerState.minutes, remainingMs: remaining, endsAt: null },
          );
        });
        timerReset.addEventListener("click", () => setTimer(initialTimer(timerState.minutes)));
        // 分を変えたら、止まっているタイマーをその分数で置き直す。走っている間は入力できない。
        timerMinutes.addEventListener("change", () => {
          const minutes = Number(timerMinutes.value);
          if (timerState.endsAt === null && isMinutes(minutes)) {
            setTimer(initialTimer(minutes));
          } else {
            timerMinutes.value = String(timerState.minutes);
          }
        });

        const tickClock = () => {
          const now = new Date();
          clock.textContent = [now.getHours(), now.getMinutes(), now.getSeconds()]
            .map((part) => String(part).padStart(2, "0"))
            .join(":");
        };

        const applyGmMode = () => {
          gmMode = location.hash === GM_HASH;
          gmbar.hidden = !gmMode;
          if (gmMode) gmToken.value = adminToken;
          gmStatus.textContent = "";
          render(lastSummary);
        };

        gmSave.addEventListener("click", () => {
          adminToken = gmToken.value.trim();
          gmStatus.textContent = persistToken(adminToken)
            ? "保存しました"
            : "このブラウザには保存できません（このタブを閉じるまで有効）";
        });
        window.addEventListener("hashchange", applyGmMode);

        applyGmMode();
        tickClock();
        renderTimer();
        setInterval(() => {
          tickClock();
          renderTimer();
        }, 1000);
        void poll();
        setInterval(() => {
          void poll();
        }, POLL_MS);
      })();
    </script>
  </body>
</html>
