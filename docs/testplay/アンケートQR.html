<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アンケートにご協力ください — 地獄のICT テストプレイ</title>
<style>
  :root {
    --ink: #111111;
    --muted: #555555;
    --paper: #ffffff;
    --rule: #d8d8d8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.5rem, 3.5vmin, 2.75rem);
    padding: clamp(1.5rem, 4vmin, 3.5rem);
    text-align: center;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium",
                 "Yu Gothic", Meiryo, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.9rem, 5.2vmin, 4rem);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: 0.02em;
  }

  .lead {
    margin: 0;
    font-size: clamp(1rem, 2.2vmin, 1.6rem);
    font-weight: 500;
    color: var(--muted);
    line-height: 1.6;
  }

  /* QRは投影前提。ページ内で最大の要素にする。 */
  .qr {
    width: clamp(400px, 56vmin, 660px);
    max-width: 100%;
    aspect-ratio: 1 / 1;
    display: block;
  }

  .qr svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .url-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6em;
    border-top: 1px solid var(--rule);
    padding-top: clamp(1rem, 2.5vmin, 1.75rem);
    width: min(100%, 46rem);
  }

  .url-label {
    margin: 0;
    font-size: clamp(0.85rem, 1.7vmin, 1.15rem);
    color: var(--muted);
  }

  .url {
    font-family: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    font-size: clamp(1.05rem, 3vmin, 2.3rem);
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    word-break: break-all;
    line-height: 1.45;
  }

  .url:hover,
  .url:focus-visible {
    text-decoration: underline;
  }

  @media print {
    body {
      min-height: auto;
      justify-content: flex-start;
      padding: 12mm;
      gap: 8mm;
    }
    h1 { font-size: 24pt; }
    .lead { font-size: 12pt; color: #333; }
    .qr { width: 105mm; }
    .url { font-size: 14pt; }
    .url-label { font-size: 10pt; color: #333; }
  }
</style>
</head>
