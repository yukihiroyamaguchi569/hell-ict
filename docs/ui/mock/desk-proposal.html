<!doctype html>
<html lang="ja" data-mode="peace" data-fs="2" data-ai="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地獄のICT — 案件デスク型シェル 提案モック</title>
<style>
/* =========================================================================
   案件デスク型シェル（提案モック）
   Everything the hospital sends is a "case" (案件). The screen always shows
   exactly two things side by side: the open case (資料 + 回答欄) and the AI.
   Tokens are the ones from docs/ui/00_共通シェルと通奏低音.md.
   ========================================================================= */
:root {
  --font-ui: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Noto Sans JP", sans-serif;
  --font-legacy: "ＭＳ ゴシック", "MS Gothic", "Osaka－等幅", "Osaka-Mono", "Hiragino Kaku Gothic ProN", monospace;
  --font-num: ui-monospace, SFMono-Regular, Menlo, "Courier New", monospace;
  --ai-surface: #f7f9fa; --ai-surface-2: #eaeef1; --ai-fg: #1a1d20; --ai-muted: #656d74; --ai-rule: #d4dbe0;
  --phs: #1f6b3f;
  /* fixed pane widths: facilitators can say "左のリスト" "右のAI" to every team */
  --w-list: 240px; --w-rail: 56px; --w-ai: 420px; --w-ai-wide: 560px;
  --h-hdr: 56px; --h-mission: 44px; --h-board: 44px;
}
[data-mode="peace"] { --bg:#f5f1e8; --surface:#fffdf8; --surface-2:#efe9dc; --fg:#2b2724; --fg-muted:#6f6559; --accent:#3f7d78; --rule:#ddd5c6; --ok:#3f7d78; --warn:#b8862b; }
[data-mode="alert"] { --bg:#14171a; --surface:#1e2226; --surface-2:#272c31; --fg:#e8ecef; --fg-muted:#8d979f; --accent:#c1121f; --rule:#2c3238; --ok:#3fa66b; --warn:#d99a1f; }
[data-mode="crisis"]{ --bg:#08090a; --surface:#101112; --surface-2:#17191b; --fg:#d8dce0; --fg-muted:#6b7176; --accent:#e01e2b; --rule:#1e2022; --ok:#3fa66b; --warn:#d99a1f; }

/* font-size steps (A- / A+). Layout widths stay in px, text scales in rem. */
html[data-fs="1"] { font-size: 15px; }
html[data-fs="2"] { font-size: 17px; }
html[data-fs="3"] { font-size: 20px; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font-ui); background: var(--bg); color: var(--fg); overflow: hidden; }
button { font: inherit; cursor: pointer; }
textarea, input { font: inherit; }

/* ---- app grid ---------------------------------------------------------- */
#app {
  height: 100vh; display: grid;
  grid-template-rows: var(--h-hdr) var(--h-mission) 1fr var(--h-board);
  grid-template-columns: var(--w-list) 1fr var(--w-ai);
  grid-template-areas: "hdr hdr hdr" "mis mis mis" "list case ai" "board board board";
}
html[data-fs="3"] #app, html[data-ai="wide"] #app { grid-template-columns: var(--w-rail) 1fr var(--w-ai); }
html[data-ai="wide"] #app { grid-template-columns: var(--w-rail) 1fr var(--w-ai-wide); }

/* ---- header ------------------------------------------------------------ */
.hdr { grid-area: hdr; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--rule); }
.hdr .brand { font-weight: 700; white-space: nowrap; }
.hdr .vitals { flex: 1; display: flex; gap: 14px; color: var(--fg-muted); font-size: .85rem; white-space: nowrap; overflow: hidden; }
.hdr .vitals b { color: var(--fg); font-family: var(--font-num); }
.hdr .vitals .fever b { color: var(--warn); }
.hdr .clock { font-family: var(--font-num); font-size: 32px; letter-spacing: .04em; }
.hdr .ctl { display: flex; gap: 6px; }
.hdr .ctl button { height: 36px; min-width: 40px; border: 1px solid var(--rule); background: var(--surface-2); color: var(--fg); border-radius: 6px; }
.hdr .ctl button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.hdr .team { padding: 4px 10px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 700; }

/* ---- mission bar -------------------------------------------------------- */
.mission { grid-area: mis; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: var(--surface-2); border-bottom: 1px solid var(--rule); font-size: .95rem; white-space: nowrap; overflow: hidden; }
.mission .stage { font-weight: 700; color: var(--accent); }
.mission .goal { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.mission .dl { font-family: var(--font-num); font-size: 1.15rem; }
.mission .dl.hot { color: var(--accent); }
.mission .cond { color: var(--fg-muted); }
.mission .cond::before { content: "クリア条件: "; }

/* ---- case list (left) --------------------------------------------------- */
.list { grid-area: list; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--rule); overflow: hidden; }
.list .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-size: .85rem; color: var(--fg-muted); border-bottom: 1px solid var(--rule); }
.list .head .n { margin-left: auto; background: var(--accent); color: #fff; border-radius: 999px; padding: 0 8px; font-family: var(--font-num); }
.list .head .n:empty { display: none; }
.list .items { flex: 1; overflow-y: auto; }
.case-row { display: grid; grid-template-columns: 22px 1fr; gap: 6px 8px; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; color: var(--fg); position: relative; }
.case-row .ico { font-size: 1rem; line-height: 1.2; }
.case-row .from { font-size: .8rem; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.case-row .subj { font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.case-row.unread .subj { font-weight: 700; }
.case-row.unread::before { content: ""; position: absolute; left: 4px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--accent); }
.case-row.open { background: var(--surface-2); box-shadow: inset 4px 0 0 var(--accent); }
.case-row.pin { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.case-row.phs .from { color: var(--phs); font-weight: 700; }
.case-row.done .subj { text-decoration: line-through; color: var(--fg-muted); }
.case-row.arrive { animation: arrive .6s ease-out; }
@keyframes arrive { from { transform: translateX(-30px); opacity: 0; background: color-mix(in srgb, var(--accent) 25%, transparent); } to { transform: none; opacity: 1; } }
.list details { border-bottom: 1px solid var(--rule); }
.list summary { padding: 8px 12px; font-size: .8rem; color: var(--fg-muted); cursor: pointer; }
/* rail mode: icons only */
html[data-fs="3"] .list .head span, html[data-ai="wide"] .list .head span,
html[data-fs="3"] .case-row .from, html[data-fs="3"] .case-row .subj,
html[data-ai="wide"] .case-row .from, html[data-ai="wide"] .case-row .subj,
html[data-fs="3"] .list summary, html[data-ai="wide"] .list summary { display: none; }
html[data-fs="3"] .case-row, html[data-ai="wide"] .case-row { grid-template-columns: 1fr; justify-items: center; padding: 12px 0; }
html[data-fs="3"] .case-row.unread::before, html[data-ai="wide"] .case-row.unread::before { left: 10px; top: 10px; margin: 0; }

/* ---- case pane (center) ------------------------------------------------- */
.case { grid-area: case; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.case .crumb { display: flex; align-items: center; gap: 8px; padding: 8px 20px; font-size: .85rem; color: var(--fg-muted); border-bottom: 1px solid var(--rule); background: var(--surface); }
.case .crumb b { color: var(--fg); }
.case .scroll { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
.case .empty { color: var(--fg-muted); padding: 40px; text-align: center; }
.sec-label { font-size: .8rem; color: var(--fg-muted); margin: 14px 0 6px; letter-spacing: .06em; }

/* "from the hospital" = 2003 style, white paper, no radius */
.legacy { font-family: var(--font-legacy); background: #fff; color: #111; border: 1px solid #999; padding: 16px 18px; max-width: 78ch; line-height: 1.65; }
.legacy .meta { font-size: .85rem; color: #444; border-bottom: 1px dotted #999; padding-bottom: 6px; margin-bottom: 10px; }
.legacy p { margin: 0 0 .8em; }
.legacy h2 { font-size: 1.05rem; margin: 0 0 6px; }
.legacy .rule { border-top: 1px solid #999; margin: 8px 0; }
.legacy .say { margin: 0 0 .5em; }
.attach { margin-top: 12px; border: 1px solid #999; background: #f4f4f4; font-family: var(--font-legacy); }
.attach summary { padding: 8px 12px; cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: center; }
.attach summary::before { content: "▸"; }
.attach[open] summary::before { content: "▾"; }
.attach summary .tools { margin-left: auto; display: flex; gap: 6px; }
.attach summary button { font-family: var(--font-ui); font-size: .8rem; padding: 3px 8px; }
.attach .sheet { overflow-x: auto; background: #fff; border-top: 1px solid #999; }
.attach table { border-collapse: collapse; font-size: .85rem; white-space: nowrap; }
.attach td, .attach th { border: 1px solid #c8c8c8; padding: 2px 8px; max-width: 36ch; white-space: normal; }
.attach th { background: #e8e8e8; font-weight: 400; }

/* answer area = today's app */
.answer { margin-top: 6px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; max-width: 78ch; }
.answer textarea { width: 100%; min-height: 7.5rem; resize: vertical; border: 1px solid var(--rule); border-radius: 6px; padding: 10px; background: var(--bg); color: var(--fg); line-height: 1.5; }
.answer .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.answer .row .grow { flex: 1; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn { height: 40px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface-2); color: var(--fg); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.verdict { margin-top: 10px; font-family: var(--font-legacy); font-size: .9rem; padding: 8px 10px; border: 1px solid #999; background: #fff; color: #111; }
.verdict:empty { display: none; }
.verdict.ok { border-color: var(--ok); }
.verdict.ng { border-color: #c1121f; }
/* grid answer */
.grid { overflow: auto; max-height: 40vh; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); }
.grid table { border-collapse: collapse; font-size: .85rem; font-family: var(--font-num); }
.grid th, .grid td { border: 1px solid var(--rule); padding: 0; }
.grid th { background: var(--surface-2); font-weight: 600; padding: 4px 8px; white-space: nowrap; font-family: var(--font-ui); }
.grid td input { width: 100%; min-width: 7ch; }
.grid td:nth-child(3) input, .grid td:nth-child(6) input { min-width: 12ch; border: 0; padding: 4px 8px; background: transparent; color: var(--fg); font-family: var(--font-num); }
.grid tr.filled td { animation: fill .8s ease-out; }
@keyframes fill { from { background: color-mix(in srgb, var(--ok) 35%, transparent); } to { background: transparent; } }
.grid-meta { font-size: .8rem; color: var(--fg-muted); margin-top: 6px; }

/* phs (苅部さん) case: same pane, green title, 2003 style, NEVER an AI bubble */
.phs-log { font-family: var(--font-legacy); background: #fff; color: #111; border: 1px solid var(--phs); max-width: 78ch; }
.phs-log .title { background: var(--phs); color: #fff; padding: 6px 12px; font-family: var(--font-ui); font-weight: 700; }
.phs-log .lines { padding: 12px 14px; line-height: 1.7; }
.phs-log .lines .wait { color: #777; }
.phs-log .cmp { display: flex; gap: 6px; border-top: 1px solid var(--phs); padding: 8px; }
.phs-log .cmp input { flex: 1; font-family: var(--font-legacy); border: 1px solid #999; padding: 6px; }
.phs-log .cmp button { font-family: var(--font-ui); }

/* ---- AI pane (right) ---------------------------------------------------- */
.ai { grid-area: ai; display: flex; flex-direction: column; background: var(--ai-surface); color: var(--ai-fg); border-left: 1px solid var(--rule); overflow: hidden; }
.ai .tools { margin-left: auto; display: flex; gap: 4px; padding-bottom: 6px; }
.ai .tools button { font-size: .8rem; padding: 4px 8px; border: 1px solid var(--ai-rule); background: #fff; border-radius: 6px; }
.ai .log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 95%; overflow-x: auto; padding: 10px 12px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; font-size: .95rem; }
.bubble.me { align-self: flex-end; background: #dfe9f3; }
.bubble.ai { align-self: flex-start; background: #fff; border: 1px solid var(--ai-rule); }
.bubble table { border-collapse: collapse; font-family: var(--font-num); font-size: .82rem; margin: 6px 0; }
.bubble td, .bubble th { border: 1px solid var(--ai-rule); padding: 2px 6px; white-space: nowrap; }
.bubble .tbl { max-height: 12rem; overflow: auto; margin-top: 8px; border: 1px solid var(--ai-rule); }
.bubble .send-to { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bubble .send-to button { white-space: nowrap; height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700; }
.bubble .send-to small { color: var(--ai-muted); }
.ai .compose { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--ai-rule); background: var(--ai-surface-2); }
.ai .compose textarea { flex: 1; min-height: 3.2rem; max-height: 8rem; resize: vertical; border: 1px solid var(--ai-rule); border-radius: 8px; padding: 8px 10px; }
.ai .compose button { width: 64px; border-radius: 8px; border: 0; background: #2b6cb0; color: #fff; font-weight: 700; }

/* ---- leaderboard band ---------------------------------------------------- */
.board { grid-area: board; padding-right: 64px !important; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--surface); border-top: 1px solid var(--rule); font-size: .8rem; color: var(--fg-muted); }
.board .track { flex: 1; position: relative; height: 6px; background: var(--rule); border-radius: 3px; }
.board .track i { position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--fg-muted); }
.board .track i.me { background: var(--accent); border-color: var(--accent); }
.board .stops { display: flex; gap: 22px; }

/* ---- overlays (full-screen dramatic ones only) --------------------------- */
.veil { position: fixed; inset: 0; background: #0d0f11; color: #e8ecef; display: flex; align-items: center; justify-content: center; z-index: 50; }
.veil.hide { display: none; }
.veil .brief { display: grid; grid-template-columns: 200px 1fr; gap: 32px; max-width: 900px; padding: 32px; }
.veil .face { width: 200px; height: 200px; border-radius: 8px; background: #2c3238; display: flex; align-items: center; justify-content: center; font-size: 4rem; }
.veil .who { color: #8d979f; margin-bottom: 8px; }
.veil .msg { font-size: 1.15rem; line-height: 1.7; }
.veil .btn { margin-top: 20px; height: 48px; font-size: 1.05rem; }

/* ---- dev bar (not product) ---------------------------------------------- */
.dev { position: fixed; right: 12px; bottom: 6px; z-index: 40; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.dev .menu { display: none; margin-bottom: 4px; flex-direction: column; gap: 4px; background: #222; padding: 8px; border-radius: 8px; }
.dev.open .menu { display: flex; }
.dev button { font-size: .78rem; padding: 6px 10px; border-radius: 6px; border: 0; background: #444; color: #eee; }
.dev > button { background: #666; opacity: .7; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <span class="brand">🏥 聖クロノス総合病院 ICT</span>
    <span class="vitals">
      <span>在院 <b>398/400</b></span><span>空床 <b>2</b></span><span>本日入院 <b>7</b></span>
      <span class="fever">原因不明の発熱 <b id="fever">3</b></span>
    </span>
    <span class="clock" id="clock">00:00</span>
    <span class="ctl">
      <button id="fs-minus" title="文字を小さく">A−</button>
      <button id="fs-plus" title="文字を大きく">A＋</button>
      <button id="ai-wide" title="AIを広げる" aria-pressed="false">AI⇔</button>
      <button id="mute" title="効果音">🔊</button>
    </span>
    <span class="team">B班</span>
  </header>

  <div class="mission">
    <span class="stage" id="m-stage">—</span>
    <span class="goal" id="m-goal">—</span>
    <span class="dl" id="m-dl"></span>
    <span class="cond" id="m-cond">—</span>
  </div>

  <nav class="list">
    <div class="head">📥 <span>案件</span> <b class="n" id="unread-n"></b></div>
    <div class="items" id="items"></div>
    <details id="prev"><summary>前のステージの案件 (<span id="prev-n">0</span>)</summary><div id="prev-items"></div></details>
  </nav>

  <main class="case">
    <div class="crumb" id="crumb">案件を選んでください</div>
    <div class="scroll" id="case-body"><div class="empty">左のリストから案件を開きます。</div></div>
  </main>

  <aside class="ai">
    <div class="log" id="ai-log"></div>
    <div class="compose">
      <textarea id="ai-input" placeholder="AIに聞く（Enterで送信、Shift+Enterで改行）"></textarea>
      <button id="ai-send">送信</button>
    </div>
  </aside>

  <footer class="board">
    <span>レース</span>
    <div class="track">
      <i style="left:12%"></i><i style="left:30%"></i><i class="me" style="left:44%"></i><i style="left:58%"></i>
    </div>
    <span class="stops">S1 · S2 · S3 · S3.5 · S4 · S5 · Final</span>
  </footer>
</div>

<div class="veil hide" id="ov-brief">
  <div class="brief">
    <div class="face" id="b-face">👩‍⚕️</div>
    <div>
      <div class="who" id="b-who"></div>
      <div class="msg" id="b-msg"></div>
      <button class="btn primary" id="b-ok">了解しました</button>
    </div>
  </div>
</div>

<div class="dev" id="dev">
  <div class="menu">
    <button data-go="s2">Stage 2 へ</button>
    <button data-go="s35">Stage 3.5 へ</button>
    <button id="dev-phs">苅部さんから着信</button>
    <button id="dev-mode">転調 peace→alert→crisis</button>
  </div>
  <button id="dev-toggle">dev</button>
</div>

  ["019","5A","2026-07-08","陰性","なし",""],["020","5A","2026-07-08","陽性","あり","接触者調査中"]
];

const PAPER_HTML = `
<h2>Unexplained Febrile Cluster in Eastern Ling Province: Preliminary Report</h2>
<div class="meta">Eastern Ling Infectious Disease Surveillance Office — Cluster Bulletin No. 18</div>
<p><b>Overview</b></p>
<p>Between 3 and 14 May, three hospitals in Eastern Ling Province reported 19 patients with fever and negative initial testing for common pathogens. This preliminary report summarizes clinical records, laboratory findings, and follow-up interviews collected through 20 May. It does not establish a causative agent, route of transmission, or common source.</p>
<p><b>Clinical Course</b></p>
<p>All 19 patients had a recorded temperature of at least 38.0°C at presentation, with fever duration ranging from two to six days. Fatigue was documented in 16 patients, headache in 13, and reduced appetite in 12; no patient reported cough, diarrhea, or rash.</p>
<p>Follow-up interviews found that 15 of 19 patients had experienced deep ocular pain 8 to 18 hours before fever onset, several describing a dull ache behind the eye that preceded any other symptom. Eleven patients described unusual sensitivity to light during the same pre-fever window. These symptoms were often recorded initially as eye strain or migraine and were not linked to fever in the original notes.</p>
<p><b>Contact Observations</b></p>
<p>Secondary illness was observed more often among people who had contact with a patient the day before that patient's fever began than among those whose contact occurred only afterward. Records of post-onset contact were incomplete, so this cannot determine whether pre-fever contact contributed to transmission.</p>
<p><b>Limitations and Immediate Request</b></p>
<p>This is a small observational report drawn from three facilities over a twelve-day period and may not generalize beyond the reporting area. Healthcare facilities are asked to record symptoms and contact history that precede unexplained fever, and to report any similar cluster to this office without delay.</p>`;

/* Each stage = mission + cases. kind: mission|mail|phs|director. answer: grid|text|none */
const STAGES = {
  s2: {

    goal: "5A病棟のMRSA記録を、会議で使える表に整形して提出せよ",
    cond: "6列・20行の正しい形式で提出",
    brief: { face: "👩‍⚕️", who: "5A病棟 師長", msg: "新しいICTの方ですよね。悪いけど急ぎで。5A病棟でMRSA疑いが出てます。手元の記録をそのままのExcelで送るので、会議で使える形にまとめてください。7時の申し送りまで、あと5分。" },
    cases: [
      { id: "s2-main", kind: "mail", from: "5A病棟 師長", subj: "至急！！MRSAのやつまとめて", pin: true,

        attach: { name: "5A病棟_MRSA_記録_最新版(2)_コピー.xlsx", head: S2_HEAD_DIRTY, rows: S2_SHEET_ROWS },
        answer: "grid" },
      { id: "s2-n1", kind: "mail", from: "3B病棟 看護師", subj: "マスクの在庫がないんですが", at: 20,
        body: ["いつもお世話になっております。", "3Bのサージカルマスク、残り2箱です。発注ってICTさんですよね？", "違ったらすみません。誰に言えばいいのか分からなくて。"], answer: "text" },
      { id: "s2-n2", kind: "mail", from: "人事課", subj: "先月の研修の出席簿がまだ提出されていません", at: 45,
        body: ["標記の件、提出期限を3週間過ぎております。", "お忙しいところ恐れ入りますが、本日中にご提出をお願いいたします。"], answer: "text" }
    ],
    phs: ["〔苅部〕また師長のExcelですか。あれ、日付の書き方が5種類くらいありますよね。", "〔苅部〕そういうの、手で直すもんじゃないですよ。……で、そっちにAIあるんでしょ？"],
    ai: (q) => tableReply()
  },
  s35: {
    name: "Stage 3.5 新情報の解釈", mode: "alert", fever: 14, deadline: 0,
    goal: "海外の速報論文を読み、院長に「これからどうするか」を報告せよ",
    cond: "院長への報告文を提出",
    brief: { face: "👨‍💼", who: "院長", msg: "海外で似た発熱クラスターの速報が出た。英語だ。うちの発熱患者14名と関係があるのか、読んで要点をまとめてくれ。そのうえで、これからどうするかを私に言ってほしい。" },
    cases: [
      { id: "s35-dir", kind: "director", from: "院長", subj: "それで、これからどうする？", pin: true,
        body: ["〔院長〕要約は読んだ。", "〔院長〕うちの発熱患者もこれかもしれないな。", "〔院長〕それで、これからどうする？"], answer: "text" },
      { id: "s35-paper", kind: "mail", from: "院長室", subj: "海外速報（英語）を転送します",
        body: ["院長からです。東陵国の感染症監視局から速報が出ています。", "英語ですが、要点を院長へ。"],
        attach: { name: "東陵国感染症監視局　クラスター速報No.18.pdf", html: PAPER_HTML }, answer: "none" },
      { id: "s35-lab", kind: "mail", from: "検査科", subj: "本日の培養結果（速報）", at: 30,
        body: ["発熱患者14名分、呼吸器ウイルスパネルはすべて陰性でした。", "血液培養は継続中です。"], answer: "none" }
    ],
    phs: ["〔苅部〕英語の論文、全部読むんですか？　……AIに「日本語で要点3つ」って頼めば早いのに。"],
    ai: (q) => "要点を3つにまとめます。\n\n1. 東陵国の3病院で、一般的な病原体が陰性の発熱患者19名のクラスターが報告されました。原因は未特定です。\n2. 19名中15名が、発熱の8〜18時間前に「目の奥の痛み」を訴えていました。11名は光に敏感になっていました。\n3. 発熱前日に接触した人のほうが二次感染が多く、発熱前に感染性がある可能性が示唆されています。\n\n貴院の発熱14名に当てはめるなら、発熱前の眼痛を訴えている患者・職員を先回りして探すことが対策の候補になります。"
  }
};

/* ===== state =========================================================== */
// log: 今いるステージのAIチャット1本ぶん。ステージが変われば goStage が空にする。
const state = { stageId: null, cases: [], prev: [], open: null, log: [], t0: Date.now(), dl: 0, timers: [] };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ===== header / mission / clock ======================================== */
function pad(n) { return String(n).padStart(2, "0"); }
setInterval(() => {
  const s = Math.floor((Date.now() - state.t0) / 1000);
  $("#clock").textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
  const dl = $("#m-dl");
  if (state.dl > 0) {
    const r = Math.max(0, state.dl - s);
    dl.textContent = "締切 " + pad(Math.floor(r / 60)) + ":" + pad(r % 60);
    dl.classList.toggle("hot", r < 60);
  } else dl.textContent = "";
}, 500);

$("#fs-minus").onclick = () => setFs(-1);
$("#fs-plus").onclick = () => setFs(1);
function setFs(d) {
  const v = Math.min(3, Math.max(1, +document.documentElement.dataset.fs + d));
  document.documentElement.dataset.fs = v;
}
$("#ai-wide").onclick = (e) => {
  const wide = document.documentElement.dataset.ai !== "wide";
  document.documentElement.dataset.ai = wide ? "wide" : "normal";
  e.currentTarget.setAttribute("aria-pressed", wide);
};
$("#mute").onclick = (e) => { e.currentTarget.textContent = e.currentTarget.textContent === "🔊" ? "🔇" : "🔊"; };

/* ===== case list ======================================================= */
const ICON = { mail: "✉", phs: "📞", director: "🏛", mission: "📌" };
function renderList() {
  const items = $("#items"); items.innerHTML = "";
  const sorted = [...state.cases].sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0));
  for (const c of sorted) {
    const b = document.createElement("button");
    b.className = "case-row " + c.kind + (c.unread ? " unread" : "") + (state.open === c.id ? " open" : "") + (c.pin ? " pin" : "") + (c.done ? " done" : "") + (c.justArrived ? " arrive" : "");
    b.innerHTML = `<span class="ico">${ICON[c.kind]}</span><span class="from">${esc(c.from)}</span><span class="ico"></span><span class="subj">${esc(c.subj)}</span>`;
    b.title = c.from + " — " + c.subj;
    b.onclick = () => openCase(c.id);
    items.appendChild(b);
    c.justArrived = false;
  }
  const n = state.cases.filter((c) => c.unread).length;
  $("#unread-n").textContent = n ? n : "";
  const prev = $("#prev-items"); prev.innerHTML = "";
  for (const c of state.prev) {
    const b = document.createElement("button");
    b.className = "case-row " + c.kind + " done";
    b.innerHTML = `<span class="ico">${ICON[c.kind]}</span><span class="from">${esc(c.from)}</span><span class="ico"></span><span class="subj">${esc(c.subj)}</span>`;
    b.onclick = () => openCase(c.id, true);
    prev.appendChild(b);
  }
  $("#prev-n").textContent = state.prev.length;
  $("#prev").style.display = state.prev.length ? "" : "none";
}

function addCase(c) {
  c.unread = true; c.justArrived = true;
  state.cases.push(c);
  renderList();
}

/* ===== case pane ======================================================= */
function findCase(id) { return state.cases.find((c) => c.id === id) || state.prev.find((c) => c.id === id); }

function openCase(id) {
  const c = findCase(id); if (!c) return;
  c.unread = false; state.open = id;
  renderList();
  $("#crumb").innerHTML = `<span>${ICON[c.kind]}</span> <b>${esc(c.subj)}</b> <span>— ${esc(c.from)}</span>`;
  const body = $("#case-body");
  body.innerHTML = "";
  if (c.kind === "phs") { body.appendChild(renderPhs(c)); body.scrollTop = 0; return; }
  body.insertAdjacentHTML("beforeend", `<div class="sec-label">資料</div>`);
  const paper = document.createElement("div"); paper.className = "legacy";
  paper.innerHTML = `<div class="meta">差出人: ${esc(c.from)}　件名: ${esc(c.subj)}</div>` + c.body.map((p) => `<p>${esc(p)}</p>`).join("");
  if (c.attach) paper.appendChild(renderAttach(c.attach));
  body.appendChild(paper);
  if (c.answer !== "none") {
    body.insertAdjacentHTML("beforeend", `<div class="sec-label">回答欄</div>`);
    body.appendChild(c.answer === "grid" ? renderGrid(c) : renderTextAnswer(c));
  }
  body.scrollTop = 0;
}

function renderAttach(a) {
  const d = document.createElement("details"); d.className = "attach"; d.open = true;
  d.innerHTML = `<summary>📎 ${esc(a.name)} <span class="tools"><button data-copy>コピー</button></span></summary>`;
  const sheet = document.createElement("div"); sheet.className = "sheet";
  if (a.html) { sheet.innerHTML = `<div class="legacy" style="border:0">${a.html}</div>`; }
  else {
    sheet.innerHTML = `<table><thead><tr>${a.head.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${a.rows.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  d.appendChild(sheet);
  d.querySelector("[data-copy]").onclick = (e) => {
    e.preventDefault();
    const text = a.html ? sheet.innerText : [a.head, ...a.rows].map((r) => r.join("\t")).join("\n");
    navigator.clipboard?.writeText(text);
    e.target.textContent = "コピーしました"; setTimeout(() => (e.target.textContent = "コピー"), 1500);
  };
  return d;
}

function renderGrid(c) {
  const wrap = document.createElement("div"); wrap.className = "answer";
  c.grid = c.grid || Array.from({ length: 20 }, () => Array(6).fill(""));
  const g = document.createElement("div"); g.className = "grid";
  g.innerHTML = `<table><thead><tr>${S2_COLS.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${c.grid.map((r, i) => `<tr data-i="${i}">${r.map((v, j) => `<td><input value="${esc(v)}" data-i="${i}" data-j="${j}"></td>`).join("")}</tr>`).join("")}</tbody></table>`;
  g.addEventListener("input", (e) => { c.grid[+e.target.dataset.i][+e.target.dataset.j] = e.target.value; });
  wrap.appendChild(g);
  const meta = document.createElement("div"); meta.className = "grid-meta"; meta.id = "grid-meta";
  meta.textContent = latestTable()
    ? "AIの表が届いています。「AIの表を取り込む」で流し込めます。"
    : "右のAIに整形を頼むと、返答の表を「AIの表を取り込む」または返答内の「回答欄へ送る」でここへ流し込めます。手で入力もできます。";
  wrap.appendChild(meta);
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<button class="btn" data-pull>AIの表を取り込む</button><span class="grow"></span><button class="btn" data-clear>クリア</button><button class="btn primary" data-submit>提出する</button>`;
  wrap.appendChild(row);
  const pull = row.querySelector("[data-pull]");
  pull.disabled = !latestTable();
  pull.title = pull.disabled ? "右のAIに整形を頼むと、返ってきた表をここへ取り込めます" : "AIの最新の表をこのグリッドへ流し込みます";
  pull.onclick = sendToGrid;
  const v = document.createElement("div"); v.className = "verdict"; wrap.appendChild(v);
  row.querySelector("[data-clear]").onclick = () => { c.grid = null; openCase(c.id); };
  row.querySelector("[data-submit]").onclick = () => {
    const filled = c.grid.filter((r) => r[0]).length;
    const ok = filled === 20 && c.grid.every((r) => !r[0] || /^\d{4}-\d{2}-\d{2}$/.test(r[2]));
    v.className = "verdict " + (ok ? "ok" : "ng");
    v.textContent = ok ? "受理しました。5A病棟師長: 「え、もう？ …助かる。あなた達、話が早いわね。」" : `再確認: 患者行 ${filled}/20、採取日の書式が揃っていない行があります。`;
    if (ok) { c.done = true; renderList(); }
  };
  return wrap;
}

function renderTextAnswer(c) {
  const wrap = document.createElement("div"); wrap.className = "answer";
  const label = c.kind === "director" ? "院長への報告" : "返信";
  wrap.innerHTML = `<textarea placeholder="${label}をここに書く">${esc(c.draft || "")}</textarea><div class="row"><span class="grow"></span><button class="btn primary" data-submit>${c.kind === "director" ? "院長に伝える" : "返信する"}</button></div><div class="verdict"></div>`;
  wrap.querySelector("textarea").oninput = (e) => (c.draft = e.target.value);
  wrap.querySelector("[data-submit]").onclick = () => {
    const v = wrap.querySelector(".verdict");
    if (!(c.draft || "").trim()) { v.className = "verdict ng"; v.textContent = "空のままでは送れません。"; return; }
    v.className = "verdict ok";
    v.textContent = c.kind === "director" ? "〔院長〕分かった。発熱の前に目が痛い者を探す、だな。すぐ各病棟に伝えろ。" : "送信しました。";
    c.done = true; renderList();
  };
  return wrap;
}

function renderPhs(c) {
  const d = document.createElement("div"); d.className = "phs-log";
  d.innerHTML = `<div class="title">📞 院内連絡先 — 情シス 苅部</div><div class="lines">${c.body.map((l) => `<div>${esc(l)}</div>`).join("")}</div><div class="cmp"><input placeholder="苅部さんに相談する"><button class="btn">送信</button></div>`;
  d.querySelector("button").onclick = () => {
    const inp = d.querySelector("input"); if (!inp.value.trim()) return;
    c.body.push("〔あなた〕" + inp.value); inp.value = "";
    const lines = d.querySelector(".lines");
    lines.innerHTML = c.body.map((l) => `<div>${esc(l)}</div>`).join("") + `<div class="wait">…返信を待っています（苅部さんは別病棟対応中）</div>`;
    setTimeout(() => { c.body.push("〔苅部〕今、別病棟対応中。あとで。"); c.unread = state.open !== c.id; renderList(); if (state.open === c.id) openCase(c.id); }, 6000);
  };
  return d;
}

/* ===== AI pane ========================================================= */
function renderLog() {
  const log = $("#ai-log"); log.innerHTML = "";
  for (const m of state.log) {
    const b = document.createElement("div"); b.className = "bubble " + m.role;
    if (m.html) b.innerHTML = m.html; else b.textContent = m.text;
    log.appendChild(b);
  }
  log.querySelectorAll("[data-send-grid]").forEach((btn) => (btn.onclick = () => sendToGrid()));
  log.scrollTop = log.scrollHeight;
}
function tableReply() {
  const table = `<table><thead><tr>${S2_COLS.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${S2_CLEAN.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  return { rows: S2_CLEAN, html: `整形しました。日付はISO形式、結果は陽性/陰性、タイトル行と空行は除きました（20行）。<div class="send-to"><button data-send-grid>回答欄へ送る</button><small>「至急！！MRSAのやつまとめて」のグリッドに流し込みます</small></div><div class="tbl">` + table + `</div>` };
}
function latestTable() {
  for (let i = state.log.length - 1; i >= 0; i--) if (state.log[i].rows) return state.log[i].rows;
  return null;
}
function sendToGrid() {
  const c = state.cases.find((x) => x.answer === "grid"); const rows = latestTable(); if (!c || !rows) return;
  c.grid = rows.map((r) => [...r]);
  openCase(c.id);
  document.querySelectorAll(".grid tbody tr").forEach((tr) => tr.classList.add("filled"));
  document.querySelector(".answer")?.scrollIntoView({ behavior: "smooth", block: "start" });
  const meta = $("#grid-meta"); if (meta) meta.textContent = "AIの表を20行流し込みました。内容を確認して提出してください。";
}
function aiSend() {
  const inp = $("#ai-input"); const q = inp.value.trim(); if (!q) return;
  inp.value = "";
  // bind the reply to the stage/log it was asked in: a stage change replaces state.log
  const log = state.log; const stageId = state.stageId;
  log.push({ role: "me", text: q }); renderLog();
  setTimeout(() => {
    if (state.log !== log) return;   // stage changed while waiting; the old conversation is gone
    const r = STAGES[stageId].ai(q);
    log.push(typeof r === "string" ? { role: "ai", text: r } : { role: "ai", html: r.html, rows: r.rows });
    renderLog();
    const open = state.cases.find((x) => x.id === state.open);
    if (open && open.answer === "grid") openCase(open.id);
  }, 900);
}
$("#ai-send").onclick = aiSend;
$("#ai-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); aiSend(); } });

/* ===== stage transition ================================================= */
function goStage(id) {
  const st = STAGES[id];
  state.timers.forEach(clearTimeout); state.timers = [];
  // previous stage's cases fold away: only "what to look at now" stays in the list
  state.prev = [...state.cases.filter((c) => c.kind !== "phs"), ...state.prev];
  state.cases = state.cases.filter((c) => c.kind === "phs"); // 苅部さんの窓口はステージをまたいで続く
  state.stageId = id; state.open = null;
  document.documentElement.dataset.mode = st.mode;
  $("#fever").textContent = st.fever;
  $("#m-stage").textContent = st.name; $("#m-goal").textContent = st.goal; $("#m-cond").textContent = st.cond;
  state.log = [];   // ステージが変わったらAIの会話は仕切り直す（前のステージの吹き出しは残さない）
  renderLog();
  $("#crumb").textContent = "案件を選んでください"; $("#case-body").innerHTML = `<div class="empty">左のリストから案件を開きます。</div>`;
  // briefing first; the clock for this stage's deadline starts on [了解しました]
  $("#b-face").textContent = st.brief.face; $("#b-who").textContent = st.brief.who; $("#b-msg").textContent = st.brief.msg;
  $("#ov-brief").classList.remove("hide");
  $("#b-ok").onclick = () => {
    $("#ov-brief").classList.add("hide");
    state.t0 = state.t0 || Date.now();
    state.dl = st.deadline ? Math.floor((Date.now() - state.t0) / 1000) + st.deadline : 0;
    for (const c of st.cases) {
      const copy = { ...c, body: [...c.body] };
      if (!c.at) addCase(copy); else state.timers.push(setTimeout(() => addCase(copy), c.at * 1000));
    }
    const first = st.cases.find((c) => c.pin); if (first) openCase(first.id);
    state.timers.push(setTimeout(phsArrive, 40000));
  };
}
function phsArrive() {
  const st = STAGES[state.stageId];
  let c = state.cases.find((x) => x.kind === "phs");
  if (!c) { c = { id: "phs", kind: "phs", from: "情シス 苅部", subj: "院内連絡先", body: [], answer: "none" }; state.cases.push(c); }
  c.body.push(...st.phs); c.subj = st.phs[0].replace(/^〔苅部〕/, "").slice(0, 22) + "…";
  c.unread = true; c.justArrived = true; renderList();
  if (state.open === c.id) openCase(c.id);
}

/* ===== dev bar ========================================================== */
$("#dev-toggle").onclick = () => $("#dev").classList.toggle("open");
document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => goStage(b.dataset.go)));
$("#dev-phs").onclick = phsArrive;
$("#dev-mode").onclick = () => { const m = ["peace", "alert", "crisis"]; const r = document.documentElement; r.dataset.mode = m[(m.indexOf(r.dataset.mode) + 1) % 3]; };

goStage("s2");
</script>
